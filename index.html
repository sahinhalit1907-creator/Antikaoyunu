   (Arayüzden bağımsız; sonuçlar döner ve Bus üzerinden duyurulur.)
   ===================================================================== */
const Game = {
  locked: new Set(),   // pazarlığı süren ilanlar: pazar tazelemesinde kaybolmaz

  /* ------------------------------ erişimciler ------------------------------ */
  player() { return DB.get('players', DB.meta.player_id); },
  balance() { return this.player().balance; },
  catalogOf(item) { return DB.get('catalog_items', item.item_id); },
  npc(id) { return DB.get('npcs', id); },
  emsal(item, cat) { return Math.round((cat || this.catalogOf(item)).base_value * COND[item.condition].mult); },  // durumuna göre emsal değer
  valueFor(item) { return item.appraised ? item.true_value : item.perceived_value; },                              // oyuncunun bildiği değer
  listings() { return DB.find('market_listings', l => l.status === 'active').sort((a, b) => (a.created_at === b.created_at ? 0 : a.created_at < b.created_at ? 1 : -1)); },
  view(l) { const item = DB.get('items', l.item_instance_id); return { l, item, cat: this.catalogOf(item), seller: this.npc(l.seller_id) }; },
  inventory() {
    const pid = DB.meta.player_id;
    return DB.find('items', i => i.owner_type === 'player' && i.owner_id === pid && (i.status === 'inventory' || i.status === 'auction'))
      .sort((a, b) => ((a.acquired_at || '') < (b.acquired_at || '') ? 1 : -1));
  },
  mood(l) { const r = l.patience / l.max_patience; return r > 0.66 ? '😊' : r > 0.33 ? '😐' : r > 0 ? '😠' : '🤬'; },

  // eski kayıtlara sonradan eklenen katalog eşyalarını (yeni oyuncaklar vb.) ekler
  syncCatalog() {
    let n = 0;
    CATALOG.forEach(c => { if (!DB.get('catalog_items', c[0])) { DB.insert('catalog_items', { id: c[0], name: c[1], category: c[2], emoji: c[3], image_url: null, rarity: c[4], base_value: c[5], era: c[6], description: c[7] }); n++; } });
    if (n) DB.save();
    return n;
  },

  /* ------------------------------ yeni oyun ------------------------------ */
  newGame() {
    DB.init();
    CATALOG.forEach(c => DB.insert('catalog_items', { id: c[0], name: c[1], category: c[2], emoji: c[3], image_url: null, rarity: c[4], base_value: c[5], era: c[6], description: c[7] }));
    SELLERS.forEach(s => DB.insert('npcs', { id: s.id, role: 'seller', name: s.name, avatar: s.avatar, trait: s.trait,
      traits: { patience: s.patience, temper: s.temper, floor: s.floor, markup: s.markup } }));
    BIDDERS.forEach(b => DB.insert('npcs', { id: b.id, role: 'bidder', name: b.name, avatar: b.avatar, trait: b.trait,
      traits: { type: b.type, specialty: b.specialty, knowledge: b.knowledge, passion: b.passion, generosity: b.generosity, flaky: b.flaky } }));
    DB.insert('npcs', { id: DEALER.id, role: 'dealer', name: DEALER.name, avatar: DEALER.avatar, trait: DEALER.trait, traits: {} });
    const p = DB.insert('players', { username: 'Antikacı', balance: CFG.START_BALANCE });
    DB.meta.player_id = p.id;
    this.refillMarket(true);
    DB.save();
  },

  /* ------------------------------ para defteri ------------------------------ */
  addTx(type, amount, itemId, counterparty, note, profit) {
    const p = this.player();
    const bal = Math.round((p.balance + amount) * 100) / 100;
    DB.update('players', p.id, { balance: bal });
    const tx = DB.insert('transactions', { player_id: p.id, type, amount, profit: profit == null ? null : profit,
      item_instance_id: itemId || null, counterparty_id: counterparty || null, note: note || '', balance_after: bal });
    Bus.emit('balance', { delta: amount, balance: bal, tx });
    return tx;
  },

  /* ------------------------------ bit pazarı ------------------------------ */
  genListing(cheapOnly) {
    const cats = DB.find('catalog_items');
    const taken = new Set(this.listings().map(l => DB.get('items', l.item_instance_id).item_id));
    let cat = null;
    for (let tries = 0; tries < 8 && !cat; tries++) {
      const rarities = cheapOnly ? [['common', 60], ['uncommon', 40]] : Object.keys(RARITY).map(k => [k, RARITY[k].w]);
      const cand = pick(cats.filter(c => c.rarity === wpick(rarities)));
      if (cand && (!taken.has(cand.id) || tries === 7)) cat = cand;
    }
    cat = cat || pick(cats);
    const seller = pick(DB.find('npcs', n => n.role === 'seller'));
    const T = seller.traits;
    const cond = wpick(Object.entries(COND).map(([k, v]) => [k, v.w]));
    const auth = wpick(Object.entries(AUTH).map(([k, v]) => [k, v.w]));
    const perceived = Math.round(cat.base_value * COND[cond].mult * rand(0.95, 1.05));
    const trueV = Math.round(cat.base_value * COND[cond].mult * AUTH[auth].mult * rand(0.93, 1.07));
    // istenen fiyat satıcının hırsına göre şişer; gizli alt sınır (reserve) istenen fiyatın %60–95'i kadardır
    const asking = niceRound(perceived * rand(0.90, 1.22) * T.markup);
    let reserve = niceRound(asking * clamp(rand(0.64, 0.92) * T.floor, 0.6, 0.95));
    if (reserve >= asking) reserve = Math.max(5, asking - 5);
    const item = DB.insert('items', { item_id: cat.id, owner_type: 'npc', owner_id: seller.id, status: 'market', condition: cond,
      authenticity: auth, perceived_value: perceived, true_value: trueV, appraised: false, acquired_price: null, acquired_at: null });
    return DB.insert('market_listings', { item_instance_id: item.id, seller_id: seller.id, asking_price: asking, initial_price: asking,
      reserve_price: reserve, patience: T.patience, max_patience: T.patience, status: 'active', sold_price: null, closed_at: null });
  },
  refillMarket(stale) {   // stale: ilanlar "yeni" rozeti taşımasın (oyun başı, yeni gün)
    let added = 0, guard = 0;
    while (this.listings().length < CFG.MARKET_SIZE && guard++ < 40) {
      const cheap = this.listings().filter(l => this.catalogOf(DB.get('items', l.item_instance_id)).base_value <= 1500).length;
      const l = this.genListing(cheap < 3);   // her zaman en az 3 uygun fiyatlı eşya bulunsun
      if (stale) l.created_at = new Date(Date.parse(l.created_at) - 120000).toISOString();
      added++;
    }
    return added;
  },
  withdraw(l, status) {
    DB.update('market_listings', l.id, { status: status || 'withdrawn', closed_at: nowIso() });
    DB.update('items', l.item_instance_id, { status: 'withdrawn' });
  },
  marketTick() {
    let removed = null;
    const open = this.listings().filter(l => !this.locked.has(l.id));
    if (open.length > 4 && Math.random() < 0.28) {
      const l = pick(open);
      removed = this.catalogOf(DB.get('items', l.item_instance_id)).name;
      this.withdraw(l);
    }
    const added = this.refillMarket();
    this.gc();
    Bus.emit('market:tick', { removed, added });
  },
  newDay() {
    this.listings().filter(l => !this.locked.has(l.id)).forEach(l => this.withdraw(l));
    DB.meta.day += 1;
    this.refillMarket(true);
    this.gc();
    DB.dirty();
    Bus.emit('market');
    return DB.meta.day;
  },
  gc() {   // eski, kapanmış ilanları temizle (veritabanı şişmesin)
    DB.find('market_listings', l => l.status !== 'active').sort((a, b) => (a.created_at < b.created_at ? 1 : -1)).slice(30).forEach(l => {
      DB.find('offers', o => o.listing_id === l.id).forEach(o => DB.remove('offers', o.id));
      const it = DB.get('items', l.item_instance_id);
      if (it && it.status === 'withdrawn') DB.remove('items', it.id);
      DB.remove('market_listings', l.id);
    });
  },

  /* ------------------------------ satın alma ------------------------------ */
  buy(listingId, price) {
    const l = DB.get('market_listings', listingId);
    if (!l || l.status !== 'active') return { ok: false, msg: 'Bu eşya artık satışta değil.' };
    price = price == null ? l.asking_price : price;
    if (this.balance() < price) return { ok: false, msg: 'Bakiyen bu eşya için yetersiz.' };
    const item = DB.get('items', l.item_instance_id), cat = this.catalogOf(item), seller = this.npc(l.seller_id);
    DB.update('market_listings', l.id, { status: 'sold', sold_price: price, closed_at: nowIso() });
    DB.update('items', item.id, { owner_type: 'player', owner_id: this.player().id, status: 'inventory', acquired_price: price, acquired_at: nowIso() });
    this.addTx('purchase', -price, item.id, seller.id, `${cat.name} satın alındı (${seller.name})`);
    Bus.emit('inventory');
    Bus.emit('market');
    return { ok: true, item, cat, seller, price };
  },

  /* ------------------------------ pazarlık ------------------------------ */
  makeOffer(listingId, amount) {
    const l = DB.get('market_listings', listingId);
    if (!l || l.status !== 'active') return { result: 'gone', msg: 'Bu eşya artık satışta değil.' };
    amount = Math.round(Number(amount));
    if (!(amount > 0)) return { result: 'invalid', msg: 'Geçerli bir teklif gir.' };
    if (amount > this.balance()) return { result: 'nofunds', msg: 'Bakiyen bu teklife yetmiyor.' };
    const seller = this.npc(l.seller_id), T = seller.traits, pid = this.player().id;
    const log = (result, counter) => DB.insert('offers', { listing_id: l.id, buyer_id: pid, amount, result,
      counter_price: counter || null, patience_after: Math.round(l.patience) });

    // 1) Kabul bölgesi: teklif satıcının gizli alt sınırına ulaştıysa anlaşma olur
    if (amount >= l.reserve_price) {
      const price = Math.min(amount, l.asking_price);
      const initial = l.initial_price;
      const buy = this.buy(l.id, price);
      if (!buy.ok) return { result: 'nofunds', msg: buy.msg };
      log('accepted');
      return { result: 'accepted', price, saved: initial - price, line: pick(LINES.accept), buy };
    }

    // 2) Reddedildi: teklif ne kadar düşük? (alt sınıra göre, istenen fiyatın oranı olarak)
    const gap = (l.reserve_price - amount) / l.asking_price;
    let kind, cost, counter = null;
    if (gap <= 0.07)      { kind = 'close';   cost = rand(6, 10);  counter = l.reserve_price * rand(1.01, 1.05); }
    else if (gap <= 0.18) { kind = 'low';     cost = rand(14, 20); counter = l.reserve_price + (l.asking_price - l.reserve_price) * 0.25; }
    else if (gap <= 0.32) { kind = 'lowball'; cost = rand(24, 32); counter = l.asking_price - (l.asking_price - l.reserve_price) * 0.30; }
    else                  { kind = 'insult';  cost = rand(36, 46); }
    cost = Math.round(cost * T.temper);
    const patience = Math.max(0, l.patience - cost);
    if (counter != null) counter = Math.min(l.asking_price, Math.max(l.reserve_price, niceRound(counter)));

    // 3) Sabır bitti → satıcı pazarlığı bırakır, satış iptal
    if (patience <= 0) {
      DB.update('market_listings', l.id, { patience: 0 });
      log('walked');
      this.withdraw(l, 'cancelled');
      Bus.emit('market');
      return { result: 'walked', patience: 0, cost, kind, line: pick(LINES.walk) };
    }

    // 4) Sabır azaldı; satıcı karşı teklif sunabilir
    const patch = { patience };
    if (counter != null && counter < l.asking_price) patch.asking_price = counter;
    DB.update('market_listings', l.id, patch);
    log(counter != null ? 'countered' : 'insulted', counter);
    return { result: counter != null ? 'countered' : 'insulted', kind, asking: l.asking_price, patience, cost, line: pick(LINES[kind]) };
  },

  /* ------------------------------ ekspertiz ------------------------------ */
  appraisalFee(item) { return Math.max(CFG.APPRAISAL_MIN, niceRound(item.perceived_value * CFG.APPRAISAL_RATE)); },
  appraise(itemId) {
    const item = DB.get('items', itemId);
    if (!item) return { ok: false, msg: 'Eşya bulunamadı.' };
    if (item.appraised) return { ok: false, msg: 'Bu eşyanın ekspertizi zaten yapıldı.' };
    const fee = this.appraisalFee(item), cat = this.catalogOf(item);
    if (this.balance() < fee) return { ok: false, msg: `Ekspertiz ücreti (${fmt(fee)}) için bakiyen yetersiz.` };
    DB.update('items', item.id, { appraised: true });
    this.addTx('appraisal', -fee, item.id, null, `${cat.name} ekspertiz ücreti`);
    Bus.emit('inventory');
    Bus.emit('market');
    return { ok: true, item, cat, fee };
  },

  /* ------------------------------ tüccara hızlı satış ------------------------------ */
  dealerQuote(item) { return niceRound(this.valueFor(item) * CFG.DEALER_RATE); },
  sellToDealer(itemId) {
    const item = DB.get('items', itemId);
    if (!item || item.owner_id !== this.player().id || item.status !== 'inventory') return { ok: false, msg: 'Bu eşya şu an satılamaz.' };
    const cat = this.catalogOf(item), price = this.dealerQuote(item);
    DB.update('items', item.id, { status: 'sold', owner_type: 'npc', owner_id: DEALER.id });
    const profit = price - (item.acquired_price || 0);
    this.addTx('dealer_sale', price, item.id, DEALER.id, `${cat.name} tüccara satıldı`, profit);
    Bus.emit('inventory');
    return { ok: true, price, profit, cat };
  },

  /* ------------------------------ istatistik & iflas ------------------------------ */
  stats() {
    const tx = DB.find('transactions');
    const sales = tx.filter(t => t.type === 'sale' || t.type === 'dealer_sale' || t.type === 'collector_sale' || t.type === 'order_sale');
    const inv = this.inventory();
    const balance = this.balance();
    const invValue = inv.reduce((s, i) => s + this.valueFor(i), 0);
    const shopValue = this.displayed().reduce((s, i) => s + this.valueFor(i), 0);   // vitrindeki eşyalar
    const profit = sales.reduce((s, t) => s + (t.profit || 0), 0);
    const wins = sales.filter(t => (t.profit || 0) > 0).length;
    const best = sales.reduce((m, t) => (!m || (t.profit || 0) > (m.profit || 0)) ? t : m, null);
    return {
      balance, invCount: inv.length, invValue, invCost: inv.reduce((s, i) => s + (i.acquired_price || 0), 0),
      shopValue, netWorth: balance + invValue + shopValue, profit, sales: sales.length, wins, winRate: sales.length ? wins / sales.length : 0,
      fees: tx.filter(t => t.type === 'appraisal').reduce((s, t) => s - t.amount, 0),
      bailouts: tx.filter(t => t.type === 'bailout').length, best
    };
  },
  isStuck() {   // para yetmiyor, satacak eşya da yok, mezat da yok
    if (this.inventory().length || this.displayed().length || DB.one('auctions', a => a.status === 'live')) return false;
    const cheapest = Math.min(...this.listings().map(l => l.reserve_price));
    return this.balance() < (isFinite(cheapest) ? cheapest : 100);
  },
  bailout() { this.addTx('bailout', CFG.BAILOUT, null, null, 'Aile yardımı: kese dolduruldu'); }
};

/* ---------- 04-auction.js ---------- */
/* =====================================================================
   BÖLÜM 4 — MEZAT (AÇIK ARTIRMA) MOTORU
   NPC alıcılar rastgele aralıklarla teklif verir; fiyat dinamik yükselir. Alıcıların gizli
   "en yüksek teklif sınırı" (max_bid) eşyanın değerinden, uzmanlıklarından ve bilgi
   düzeylerinden türetilir. Oyuncu "SAT!" ile anında kapatır; teklif durursa çekiç kendiliğinden düşer.
   ===================================================================== */
const Auction = {
  timer: null, feed: [], feedN: 0, feedVer: 0, call: '',

  live() { return DB.one('auctions', a => a.status === 'live'); },

  /* artış basamağı: fiyat büyüdükçe adım da büyür */
  inc(price) {
    const raw = price * 0.035;
    for (const s of [5, 10, 25, 50, 100, 250, 500, 1000, 2500]) if (raw <= s) return s;
    return 5000;
  },

  /* bir alıcının eşyaya biçtiği değer (teklif tavanı) */
  valuation(bidder, item, cat) {
    const T = bidder.traits;
    let v = item.perceived_value * (1 - T.knowledge) + item.true_value * T.knowledge;   // bilgisi arttıkça gerçek değere yaklaşır
    v *= T.specialty ? (T.specialty === cat.category ? T.passion : 0.92) : 1;           // uzmanlık alanı
    v *= T.generosity * CFG.AUCTION_HEAT * rand(0.85, 1.12);                             // kişisel zevk / cömertlik / salon heyecanı
    return Math.max(5, Math.round(v));
  },

  suggestStart(item) {
    const ref = Game.valueFor(item);
    return { ref, low: niceRound(ref * 0.2), mid: niceRound(ref * 0.4), high: niceRound(ref * 0.7) };
  },

  /* ------------------------------ akış ------------------------------ */
  pushFeed(e) { e.n = ++this.feedN; this.feed.unshift(e); if (this.feed.length > 60) this.feed.length = 60; this.feedVer++; },
  begin() { this.stop(); this.timer = setInterval(() => { try { this.tick(); } catch (err) { console.error('[Auction.tick]', err); } }, CFG.AUCTION_TICK_MS); },
  stop() { if (this.timer) { clearInterval(this.timer); this.timer = null; } this.call = ''; },

  start(itemId, startPrice) {
    if (this.live()) return { ok: false, msg: 'Zaten süren bir mezat var. Önce onu bitir.' };
    const item = DB.get('items', itemId);
    if (!item || item.owner_id !== Game.player().id || item.status !== 'inventory') return { ok: false, msg: 'Bu eşya mezata çıkarılamaz.' };
    startPrice = Math.round(Number(startPrice));
    if (!(startPrice >= 5)) return { ok: false, msg: 'Açılış fiyatı en az ₺5 olmalı.' };
    const cat = Game.catalogOf(item);
    const bidders = shuffle(DB.find('npcs', n => n.role === 'bidder')).slice(0, randInt(5, 7));
    const participants = bidders.map(b => ({ bidder_id: b.id, max_bid: this.valuation(b, item, cat),
      interest: +rand(0.5, 1).toFixed(2), active: true, flaky: !!b.traits.flaky }));
    const now = Date.now();
    const a = DB.insert('auctions', { item_instance_id: item.id, seller_id: Game.player().id, start_price: startPrice,
      current_price: startPrice, current_bidder_id: null, top_bid_id: null, bid_count: 0, final_price: null, status: 'live',
      participants, started_at: nowIso(), started_ms: now, last_bid_ms: now, ended_at: null });
    DB.update('items', item.id, { status: 'auction' });
    this.feed = []; this.feedN = 0; this.call = '';
    this.pushFeed({ kind: 'sys', text: `🔔 Mezat başladı! Açılış fiyatı ${fmt(startPrice)}` });
    this.begin();
    Bus.emit('inventory');
    Bus.emit('auction:start', a);
    return { ok: true, auction: a };
  },

  resume() {   // sayfa yenilendiğinde süren bir mezat varsa kaldığı yerden devam et
    const a = this.live();
    if (!a) return;
    const item = DB.get('items', a.item_instance_id);
    if (!item) { Object.assign(a, { status: 'cancelled', ended_at: nowIso() }); return; }
    a.started_ms = Date.now(); a.last_bid_ms = Date.now();
    this.feed = []; this.feedN = 0;
    this.pushFeed({ kind: 'sys', text: '⏯️ Mezat kaldığı yerden devam ediyor' });
    this.begin();
  },

  placeBid(a, p, amount) {
    const bidder = Game.npc(p.bidder_id);
    const bid = DB.insert('bids', { auction_id: a.id, bidder_id: p.bidder_id, amount, status: 'active' });
    a.current_price = amount; a.current_bidder_id = p.bidder_id; a.top_bid_id = bid.id;
    a.bid_count = (a.bid_count || 0) + 1; a.last_bid_ms = Date.now();
    this.pushFeed({ kind: 'bid', bid_id: bid.id, bidder_id: p.bidder_id, avatar: bidder.avatar, name: bidder.name, amount, opening: a.bid_count === 1 });
    Bus.emit('auction:bid', { auction: a, bid, bidder });
  },

  withdrawTop(a, tp) {   // güvenilmez alıcı teklifini geri çeker → fiyat bir önceki teklife düşer
    const bidder = Game.npc(tp.bidder_id);
    DB.find('bids', b => b.auction_id === a.id && b.bidder_id === tp.bidder_id && b.status === 'active')
      .forEach(b => DB.update('bids', b.id, { status: 'withdrawn' }));
    tp.active = false;
    const rest = DB.find('bids', b => b.auction_id === a.id && b.status === 'active').sort((x, y) => y.amount - x.amount);
    const prev = rest[0] || null;
    a.current_price = prev ? prev.amount : a.start_price;
    a.current_bidder_id = prev ? prev.bidder_id : null;
    a.top_bid_id = prev ? prev.id : null;
    a.last_bid_ms = Date.now();
    this.feed.forEach(e => { if (e.kind === 'bid' && e.bidder_id === tp.bidder_id) e.gone = true; });
    this.pushFeed({ kind: 'sys', text: `⚠️ ${bidder.name} teklifini geri çekti!` });
    Bus.emit('auction:withdraw', { auction: a, bidder });
  },

  tick() {
    const a = this.live();
    if (!a) { this.stop(); return; }
    const now = Date.now(), parts = a.participants;

    // 1) güvenilmez alıcı en yüksek teklifini geri çekebilir (çekici geciktiren risk!)
    if (a.current_bidder_id) {
      const tp = parts.find(p => p.bidder_id === a.current_bidder_id);
      if (tp && tp.flaky && now - a.last_bid_ms > 3000 && Math.random() < CFG.FLAKY_WITHDRAW) this.withdrawTop(a, tp);
    }

    // 2) yeni teklif
    const top = a.current_bidder_id;
    const nextMin = top ? a.current_price + this.inc(a.current_price) : a.start_price;
    const can = parts.filter(p => p.active && p.bidder_id !== top && p.max_bid >= nextMin);
    if (can.length && Math.random() < Math.min(0.75, 0.28 + can.length * 0.12)) {
      const p = wpick(can.map(c => [c, c.interest]));
      let amount = a.start_price;
      if (top) {
        const inc = this.inc(a.current_price), room = (p.max_bid - a.current_price) / inc;
        // tavanına çok uzak olan alıcı daha iri adımlarla yükseltir → düşük açılışlı mezatlar da hızla ısınır
        const jumps = room > 12 ? wpick([[2, 25], [3, 30], [5, 25], [8, 20]]) : wpick([[1, 62], [2, 26], [3, 12]]);
        amount = a.current_price + inc * jumps;
      }
      amount = Math.max(nextMin, Math.min(amount, p.max_bid));
      this.placeBid(a, p, amount);
    }

    // 3) kimse teklif veremiyorsa: "Bir… İki… Satıldı!" ya da hiç teklif gelmediyse kapanış
    const top2 = a.current_bidder_id;
    const next2 = top2 ? a.current_price + this.inc(a.current_price) : a.start_price;
    const anyLeft = parts.some(p => p.active && p.bidder_id !== top2 && p.max_bid >= next2);
    const prevCall = this.call;
    this.call = '';
    if (!anyLeft) {
      if (!top2) {
        if (now - a.started_ms > CFG.NO_BID_END_MS) { this.endWithoutSale(a, 'unsold'); return; }
      } else {
        const idle = now - a.last_bid_ms;
        this.call = idle >= CFG.CALL_TWO ? 'İki…' : idle >= CFG.CALL_ONE ? 'Bir…' : '';
        if (idle >= CFG.CALL_SOLD) { this.hammer(true); return; }
      }
    }
    DB.dirty();
    if (this.call !== prevCall) Bus.emit('auction:call', { text: this.call, auction: a });
    Bus.emit('auction:tick', a);
  },

  /* ------------------------------ çekiç ------------------------------ */
  hammer(auto) {
    const a = this.live();
    if (!a) return { ok: false, msg: 'Süren bir mezat yok.' };
    if (!a.current_bidder_id) return { ok: false, msg: 'Henüz hiç teklif gelmedi — çekiç vuracak kimse yok!' };
    const item = DB.get('items', a.item_instance_id), cat = Game.catalogOf(item);
    const bidder = Game.npc(a.current_bidder_id), price = a.current_price;
    Object.assign(a, { status: 'sold', final_price: price, ended_at: nowIso() });
    if (a.top_bid_id) DB.update('bids', a.top_bid_id, { status: 'winning' });
    DB.update('items', item.id, { status: 'sold', owner_type: 'npc', owner_id: bidder.id });
    const profit = price - (item.acquired_price || 0);
    this.stop();
    Game.addTx('sale', price, item.id, bidder.id, `${cat.name} mezatta satıldı (${bidder.name})`, profit);
    DB.save();
    Bus.emit('inventory');
    Bus.emit('auction:end', { status: 'sold', auto: !!auto, auction: a, item, cat, bidder, price, profit });
    return { ok: true, price, profit };
  },

  endWithoutSale(a, status) {   // 'unsold' | 'cancelled' → eşya envantere geri döner
    const item = DB.get('items', a.item_instance_id), cat = Game.catalogOf(item);
    Object.assign(a, { status, ended_at: nowIso() });
    DB.update('items', item.id, { status: 'inventory' });
    this.stop();
    DB.save();
    Bus.emit('inventory');
    Bus.emit('auction:end', { status, auction: a, item, cat, price: 0, profit: 0 });
  },
  cancel() {
    const a = this.live();
    if (!a) return { ok: false };
    this.endWithoutSale(a, 'cancelled');
    return { ok: true };
  },

  /* ------------------------------ arayüz yardımcıları ------------------------------ */
  paddles(a) {
    const nextMin = a.current_bidder_id ? a.current_price + this.inc(a.current_price) : a.start_price;
    return a.participants.map(p => ({
      npc: Game.npc(p.bidder_id),
      state: p.bidder_id === a.current_bidder_id ? 'top' : (!p.active || p.max_bid < nextMin) ? 'out' : 'in'
    }));
  },
  history(limit) {
    return DB.find('auctions', a => a.status !== 'live').sort((x, y) => ((x.ended_at || '') < (y.ended_at || '') ? 1 : -1)).slice(0, limit || 6);
  }
};

/* ---------- 04-shop.js ---------- */
/* =====================================================================
   BÖLÜM 4b — DÜKKAN / MÜZE: camekânlar, sergilenen eşyalar, ziyaretçiler, koleksiyoncu teklifleri
   Arayüzden bağımsızdır (Game'e eklenir). Tablolar: shops (oyuncu başına 1 satır), shop_offers.
   Sergilenen eşya: items.status = 'display', items.display_slot = vitrin yuvası (0..N-1).
   ===================================================================== */
const SHOP = {
  SLOTS: 6, MAX_CAB: 5, CAB_COST: [0, 2500, 6000, 12000, 25000],   // vitrin başına yuva; n. vitrinin fiyatı
  TICK_MS: 20000, CATCHUP_TICKS: 90,                               // ziyaretçi turu aralığı; çevrimdışı en çok 30 dk telafi
  OFFER_TTL: 4 * 60 * 1000, MAX_OFFERS: 3,
  PTS: { common: 2, uncommon: 4, rare: 8, epic: 16, legendary: 40 },
  COND: { poor: 0.7, fair: 0.9, good: 1, excellent: 1.2 },
  LEVELS: [
    { min: 0,   name: 'Köşe Tezgâhı',     ico: '🪑' },
    { min: 25,  name: 'Küçük Dükkân',     ico: '🏪' },
    { min: 70,  name: 'Antikacı Galerisi', ico: '🖼️' },
    { min: 160, name: 'Şehir Müzesi',     ico: '🏛️' },
    { min: 340, name: 'Ulusal Koleksiyon', ico: '👑' }
  ]
};

Object.assign(Game, {
  shop() {
    const pid = DB.meta.player_id;
    return DB.one('shops', s => s.player_id === pid) ||
      DB.insert('shops', { player_id: pid, name: 'Antika Dükkânım', cabinets: 1, visitors: 0, revenue: 0, last_tick_ms: Date.now() });
  },
  displayed() {
    const pid = DB.meta.player_id;
    return DB.find('items', i => i.owner_type === 'player' && i.owner_id === pid && i.status === 'display');
  },
  slotCount() { return this.shop().cabinets * SHOP.SLOTS; },
  itemAtSlot(n) { return this.displayed().find(i => i.display_slot === n) || null; },
  freeSlot() { const used = new Set(this.displayed().map(i => i.display_slot)); for (let n = 0; n < this.slotCount(); n++) if (!used.has(n)) return n; return -1; },
  cabinetPrice() { const s = this.shop(); return s.cabinets >= SHOP.MAX_CAB ? 0 : SHOP.CAB_COST[s.cabinets]; },

  displayItem(itemId, slot) {
    const item = DB.get('items', itemId);
    if (!item || item.owner_id !== DB.meta.player_id || item.status !== 'inventory') return { ok: false, msg: 'Bu eşya şu an sergilenemez.' };
    if (slot == null || slot < 0) slot = this.freeSlot();
    if (slot < 0 || slot >= this.slotCount() || this.itemAtSlot(slot)) return { ok: false, msg: 'Vitrinde boş yer yok. Yeni bir vitrin satın alabilir ya da bir eşyayı indirebilirsin.' };
    DB.update('items', item.id, { status: 'display', display_slot: slot });
    Bus.emit('inventory'); Bus.emit('shop');
    return { ok: true, item, cat: this.catalogOf(item), slot };
  },
  undisplayItem(itemId) {
    const item = DB.get('items', itemId);
    if (!item || item.status !== 'display') return { ok: false, msg: 'Eşya vitrinde değil.' };
    DB.update('items', item.id, { status: 'inventory', display_slot: null });
    DB.find('shop_offers', o => o.item_instance_id === item.id && o.status === 'open').forEach(o => DB.update('shop_offers', o.id, { status: 'withdrawn' }));
    Bus.emit('inventory'); Bus.emit('shop');
    return { ok: true, item, cat: this.catalogOf(item) };
  },
  buyCabinet() {
    const s = this.shop(), price = this.cabinetPrice();
    if (s.cabinets >= SHOP.MAX_CAB) return { ok: false, msg: 'Dükkânda daha fazla vitrin için yer yok.' };
    if (this.balance() < price) return { ok: false, msg: `Yeni vitrin için ${fmt(price)} gerekiyor.` };
    DB.update('shops', s.id, { cabinets: s.cabinets + 1 });
    this.addTx('shop', -price, null, null, `${s.cabinets + 1}. vitrin satın alındı`);
    Bus.emit('shop');
    return { ok: true, price, cabinets: s.cabinets + 1 };
  },

  /* ---- koleksiyon puanı ---- */
  itemPoints(item) {
    const cat = this.catalogOf(item);
    let p = SHOP.PTS[cat.rarity] * SHOP.COND[item.condition];
    if (item.appraised) p *= item.authenticity === 'fake' ? 0.15 : item.authenticity === 'exceptional' ? 1.6 : 1;
    return p;
  },
  prestige() {
    const list = this.displayed();
    if (!list.length) return { points: 0, sets: [], cats: 0, value: 0, count: 0 };
    const byCat = {}; list.forEach(i => { const c = this.catalogOf(i).category; byCat[c] = (byCat[c] || 0) + 1; });
    const sets = Object.entries(byCat).filter(([, n]) => n >= 3).map(([c, n]) => ({ cat: c, n, bonus: (n - 2) * 6 }));
    const base = list.reduce((s, i) => s + this.itemPoints(i), 0);
    const cats = Object.keys(byCat).length;
    return { points: Math.round(base + cats * 4 + sets.reduce((s, x) => s + x.bonus, 0)), sets, cats, count: list.length, value: list.reduce((s, i) => s + this.valueFor(i), 0) };
  },
  level(points) {
    let idx = 0; SHOP.LEVELS.forEach((l, i) => { if (points >= l.min) idx = i; });
    const cur = SHOP.LEVELS[idx], next = SHOP.LEVELS[idx + 1] || null;
    return { idx, cur, next, pct: next ? clamp((points - cur.min) / (next.min - cur.min), 0, 1) : 1 };
  },
  visitorsPerTick(points) { return points <= 0 ? 0 : points / 30; },
  ticketFee(points) { return Math.round(4 + points / 10); },

  /* ---- ziyaretçi turu: giriş ücreti, sahte ifşası, koleksiyoncu teklifi ---- */
  shopTick(count, silent) {
    count = count || 1;
    const out = { visitors: 0, revenue: 0, exposed: [], offers: 0 };
    const s = this.shop();
    for (let t = 0; t < count; t++) {
      const pr = this.prestige();
      if (!pr.count) break;
      const lam = this.visitorsPerTick(pr.points); let v = 0;
      for (let k = 0; k < 12; k++) if (Math.random() < lam / 12) v++;          // ~Poisson
      const fee = this.ticketFee(pr.points);
      for (let k = 0; k < v; k++) out.revenue += Math.round(fee * rand(0.7, 1.3));
      out.visitors += v;
      this.displayed().filter(i => !i.appraised && i.authenticity === 'fake' && Math.random() < 0.05).forEach(i => {   // bir uzman fark etti
        DB.update('items', i.id, { appraised: true }); out.exposed.push(i);
      });
      if (!silent || t === count - 1) this.expireOffers();
      if (Math.random() < 0.07 && DB.find('shop_offers', o => o.status === 'open').length < SHOP.MAX_OFFERS) { if (this.collectorOffer()) out.offers++; }
    }
    DB.update('shops', s.id, { last_tick_ms: Date.now(), visitors: s.visitors + out.visitors });
    if (out.revenue > 0) this.addMuseumIncome(out.revenue, out.visitors);
    if (out.exposed.length || out.offers) Bus.emit('inventory');
    Bus.emit('shop', out);
    return out;
  },
  addMuseumIncome(amount, visitors) {   // defter şişmesin: son giriş geliri kaydını birleştir
    const p = this.player(), s = this.shop();
    const last = DB.find('transactions').sort((a, b) => (a.created_at < b.created_at ? 1 : -1))[0];
    DB.update('shops', s.id, { revenue: DB.get('shops', s.id).revenue + amount });
    if (last && last.type === 'museum' && Date.now() - new Date(last.created_at).getTime() < 10 * 60 * 1000) {
      const bal = Math.round((p.balance + amount) * 100) / 100, n = (last.visitors || 0) + visitors, tot = last.amount + amount;
      DB.update('players', p.id, { balance: bal });
      DB.update('transactions', last.id, { amount: tot, visitors: n, balance_after: bal, note: `Müze girişleri · ${n} ziyaretçi` });
      Bus.emit('balance', { delta: amount, balance: bal, tx: last });
    } else {
      const tx = this.addTx('museum', amount, null, null, `Müze girişleri · ${visitors} ziyaretçi`);
      DB.update('transactions', tx.id, { visitors });
    }
  },
  collectorOffer() {
    const cand = this.displayed().filter(i => !DB.one('shop_offers', o => o.item_instance_id === i.id && o.status === 'open'));
    if (!cand.length) return null;
    const item = pick(cand), b = pick(DB.find('npcs', n => n.role === 'bidder')), cat = this.catalogOf(item);
    const spec = b.traits && b.traits.specialty === cat.category ? 0.12 : 0;           // uzmanlık alanıysa daha cömert
    const amount = niceRound(item.true_value * rand(1.1, 1.5) * (1 + spec));
    return DB.insert('shop_offers', { item_instance_id: item.id, bidder_id: b.id, amount, status: 'open', expires_ms: Date.now() + SHOP.OFFER_TTL });
  },
  openOffers() { return DB.find('shop_offers', o => o.status === 'open').sort((a, b) => a.expires_ms - b.expires_ms); },
  expireOffers() {
    const now = Date.now();
    let ch = false;
    DB.find('shop_offers', o => o.status === 'open' && (o.expires_ms < now || !DB.get('items', o.item_instance_id) || DB.get('items', o.item_instance_id).status !== 'display'))
      .forEach(o => { DB.update('shop_offers', o.id, { status: 'expired' }); ch = true; });
    return ch;
  },
  acceptOffer(id) {
    const o = DB.get('shop_offers', id), item = o && DB.get('items', o.item_instance_id);
    if (!o || o.status !== 'open' || !item || item.status !== 'display') return { ok: false, msg: 'Bu teklif artık geçerli değil.' };
    const cat = this.catalogOf(item), b = this.npc(o.bidder_id);
    DB.update('shop_offers', o.id, { status: 'accepted' });
    DB.update('items', item.id, { status: 'sold', owner_type: 'npc', owner_id: b.id, display_slot: null });
    const profit = o.amount - (item.acquired_price || 0);
    this.addTx('collector_sale', o.amount, item.id, b.id, `${cat.name} vitrinden ${b.name}'a satıldı`, profit);
    Bus.emit('inventory'); Bus.emit('shop');
    return { ok: true, price: o.amount, profit, cat, buyer: b };
  },
  declineOffer(id) {
    const o = DB.get('shop_offers', id);
    if (!o || o.status !== 'open') return { ok: false };
    DB.update('shop_offers', o.id, { status: 'declined' });
    Bus.emit('shop');
    return { ok: true };
  },
  shopCatchUp() {   // oyun kapalıyken gelen ziyaretçiler
    if (!this.openOrders().length) this.newOrder();   // her açılışta bekleyen en az bir müşteri
    const s = this.shop(), ticks = Math.min(SHOP.CATCHUP_TICKS, Math.floor((Date.now() - (s.last_tick_ms || Date.now())) / SHOP.TICK_MS));
    DB.find('shop_offers', o => o.status === 'open').forEach(o => { if (o.expires_ms < Date.now()) DB.update('shop_offers', o.id, { status: 'expired' }); });
    if (ticks < 3 || !this.displayed().length) { DB.update('shops', s.id, { last_tick_ms: Date.now() }); return null; }
    return this.shopTick(ticks, true);
  }
});

/* =====================================================================
   MÜŞTERİ SİPARİŞLERİ — müşteri bütçesine göre belirli bir antika ister; uygun fiyata bulup pahalıya sat.
   Tablo: orders (kind: 'item' = belirli eşya, 'category' = kategori + asgari nadirlik).
   ===================================================================== */
const RANKS = ['common', 'uncommon', 'rare', 'epic', 'legendary'], CRANKS = ['poor', 'fair', 'good', 'excellent'];
const ORDER = { TTL: 9 * 60 * 1000, MAX_OPEN: 3, CHANCE: 0.16 };
const CUSTOMERS = [
  { id: 'cus-ayse',   name: 'Ayşe Hanım',      avatar: '👩‍🏫', trait: 'Emekli öğretmen' },
  { id: 'cus-murat',  name: 'Murat Bey',       avatar: '🧑‍💼', trait: 'İş insanı' },
  { id: 'cus-lale',   name: 'Lale',            avatar: '👩‍🎨', trait: 'İç mimar' },
  { id: 'cus-orhan',  name: 'Dr. Orhan',       avatar: '👨‍⚕️', trait: 'Koleksiyoncu doktor' },
  { id: 'cus-zeynep', name: 'Zeynep',          avatar: '👩‍💻', trait: 'Otel sahibi' },
  { id: 'cus-feridun', name: 'Feridun Efendi', avatar: '🧓',   trait: 'Eski kitapçı' },
  { id: 'cus-suna',   name: 'Suna Hanım',      avatar: '👵',   trait: 'Torunlarına hediye alıyor' },
  { id: 'cus-kerem',  name: 'Kerem',           avatar: '🧑‍🎤', trait: 'Film dekoru yapımcısı' }
];

Object.assign(Game, {
  customer(id) { return CUSTOMERS.find(c => c.id === id) || CUSTOMERS[0]; },
  openOrders() { const now = Date.now(); return DB.find('orders', o => o.status === 'open' && o.expires_ms > now).sort((a, b) => a.expires_ms - b.expires_ms); },
  expireOrders() {
    const now = Date.now(); let ch = 0;
    DB.find('orders', o => o.status === 'open' && o.expires_ms <= now).forEach(o => { DB.update('orders', o.id, { status: 'expired' }); ch++; });
    const old = DB.find('orders', o => o.status !== 'open').sort((a, b) => (a.created_at < b.created_at ? 1 : -1)).slice(20);
    old.forEach(o => DB.remove('orders', o.id));
    return ch;
  },
  orderMatch(o, item) {
    const cat = this.catalogOf(item);
    if (o.kind === 'item' ? cat.id !== o.item_id : (cat.category !== o.category || RANKS.indexOf(cat.rarity) < RANKS.indexOf(o.min_rarity))) return false;
    return CRANKS.indexOf(item.condition) >= CRANKS.indexOf(o.min_condition);
  },
  orderBlock(o, item) {   // eşleşen eşya teslim edilemiyorsa nedeni
    if (o.need_genuine && !item.appraised) return 'Müşteri belgeli orijinal istiyor — önce ekspertiz yaptır';
    if (o.need_genuine && item.authenticity === 'fake') return 'Taklit çıktı, müşteri kabul etmez';
    return '';
  },
  ordersFor(item) { return this.openOrders().filter(o => this.orderMatch(o, item)); },
  orderPay(o, item) {
    const bonus = item.appraised && item.authenticity === 'exceptional' ? 0.15 : item.condition === 'excellent' ? 0.08 : 0;
    return Math.round(o.budget * (1 + bonus));
  },
  newOrder(opts) {
    opts = opts || {};
    const kind = opts.kind || (Math.random() < 0.55 ? 'item' : 'category');
    const need = opts.need_genuine != null ? opts.need_genuine : Math.random() < 0.65;
    const minCond = opts.min_condition || wpick([['poor', 25], ['fair', 35], ['good', 30], ['excellent', 10]]);
    const cust = opts.customer ? this.customer(opts.customer) : pick(CUSTOMERS), laxity = need ? 1 : 0.75;
    const row = { customer_id: cust.id, kind, item_id: null, category: null, min_rarity: null, min_condition: minCond, need_genuine: need, budget: 0, line: '', status: 'open', expires_ms: Date.now() + (opts.ttl || ORDER.TTL) };
    if (kind === 'item') {
      let cat = opts.item_id && DB.get('catalog_items', opts.item_id);
      if (!cat) {
        const inMarket = this.listings().map(l => this.catalogOf(DB.get('items', l.item_instance_id))).filter(c => c && c.rarity !== 'legendary');
        cat = Math.random() < 0.65 && inMarket.length ? pick(inMarket)
          : wpick(DB.find('catalog_items', c => c.rarity !== 'legendary').map(c => [c, { common: 3, uncommon: 3, rare: 2, epic: 0.6 }[c.rarity]]));
      }
      row.item_id = cat.id;
      row.budget = niceRound(cat.base_value * COND[minCond].mult * rand(1.35, 1.75) * laxity);
      row.line = pick([`Torunuma hediye edeceğim bir “${cat.name}” arıyorum.`, `Salonuma çok yakışır: “${cat.name}”. Bulabilir misin?`, `Bana bir “${cat.name}” lazım, bütçem belli.`]);
    } else {
      const cat = opts.category || pick(CATEGORIES)[0];
      const minR = opts.min_rarity || wpick([['common', 40], ['uncommon', 40], ['rare', 20]]);
      const lo = RANKS.indexOf(minR);
      let pool = CATALOG.filter(c => c[2] === cat && RANKS.indexOf(c[4]) >= lo && RANKS.indexOf(c[4]) <= Math.min(lo + 1, 2));
      if (!pool.length) pool = CATALOG.filter(c => c[2] === cat && RANKS.indexOf(c[4]) <= 2);
      const avg = pool.reduce((s, c) => s + c[5], 0) / pool.length;
      row.category = cat; row.min_rarity = minR;
      row.budget = niceRound(avg * COND[minCond].mult * rand(1.15, 1.4) * laxity);
      row.line = pick([`${cat} alanında ${RARITY[minR].label.toLowerCase()} bir parça arıyorum.`, `Koleksiyonuma bir ${cat} eşyası lazım.`, `${cat} kategorisinden bir şey bul bana, yeter ki ${RARITY[minR].label.toLowerCase()} olsun.`]);
    }
    return DB.insert('orders', row);
  },
  orderRoll() {
    this.expireOrders();
    if (this.openOrders().length >= ORDER.MAX_OPEN) return null;
    const pts = this.prestige().points;
    return Math.random() < ORDER.CHANCE + Math.min(0.1, pts / 2000) ? this.newOrder() : null;
  },
  fulfillOrder(orderId, itemId) {
    const o = DB.get('orders', orderId), item = DB.get('items', itemId);
    if (!o || o.status !== 'open' || o.expires_ms <= Date.now()) return { ok: false, msg: 'Bu sipariş artık geçerli değil.' };
    if (!item || item.owner_id !== DB.meta.player_id || item.status !== 'inventory') return { ok: false, msg: 'Bu eşya teslim edilemez (envanterinde olmalı).' };
    if (!this.orderMatch(o, item)) return { ok: false, msg: 'Eşya müşterinin istediğiyle uyuşmuyor.' };
    const why = this.orderBlock(o, item); if (why) return { ok: false, msg: why + '.' };
    const cat = this.catalogOf(item), cust = this.customer(o.customer_id), pay = this.orderPay(o, item);
    DB.update('orders', o.id, { status: 'done', delivered_item_id: item.id, paid: pay });
    DB.update('items', item.id, { status: 'sold', owner_type: 'npc', owner_id: cust.id, display_slot: null });
    const profit = pay - (item.acquired_price || 0);
    this.addTx('order_sale', pay, item.id, cust.id, `${cat.name} → ${cust.name} (sipariş)`, profit);
    Bus.emit('inventory'); Bus.emit('shop');
    return { ok: true, pay, profit, cat, cust, bonus: pay - o.budget };
  },
  declineOrder(id) {
    const o = DB.get('orders', id);
    if (!o || o.status !== 'open') return { ok: false };
    DB.update('orders', o.id, { status: 'declined' }); Bus.emit('shop'); return { ok: true };
  }
});

// sipariş turu: shopTick içinde her tur denenir (vitrin boşken de)
(function hookOrders() {
  const base = Game.shopTick;
  Game.shopTick = function (count, silent) {
    let fresh = 0;
    for (let i = 0; i < (count || 1); i++) if (this.orderRoll()) fresh++;
    const out = base.call(this, count, silent);
    out.orders = fresh;
    if (fresh) Bus.emit('shop', out);
    return out;
  };
})();

/* =====================================================================
   BÖLÜM 5 — ARAYÜZ ÇEKİRDEĞİ: durum, bildirimler (toast), modal, gezinme, bakiye
   ===================================================================== */
const UI = {
  tab: 'market',
  filter: { market: 'all', inv: 'all' },
  bargain: null,            // açık pazarlık oturumu
  auctionBuilt: false,      // canlı mezat iskeleti kuruldu mu?
  feedShown: 0, feedVerShown: -1
};
const TABS = [
  { id: 'market',    label: 'Bit Pazarı', ico: '🛒' },
  { id: 'inventory', label: 'Envanter',   ico: '🎒' },
  { id: 'shop',      label: 'Dükkan',     ico: '🏛️' },

  { id: 'ledger',    label: 'Defter',     ico: '📒' }
];

/* ------------------------------ Toast bildirimleri ------------------------------ */
function toast(msg, type, title, ttl) {
  type = type || 'info'; ttl = ttl || 3800;
  const icons = { info: 'ℹ️', success: '✅', error: '⛔', warn: '⚠️', gold: '🔨' };
  const box = $('#toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="t-ico">${icons[type] || icons.info}</span><div>${title ? `<b>${esc(title)}</b>` : ''}${esc(msg)}</div>`;
  box.appendChild(el);
  while (box.children.length > 4) box.firstElementChild.remove();
  const close = () => { if (!el.isConnected || el.classList.contains('out')) return; el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  el.addEventListener('click', close);
  setTimeout(close, ttl);
  Sound.toast(type);
}

/* ------------------------------ Modal ------------------------------ */
const Modal = {
  onClose: null, dismissible: true, _confirm: null,
  open(html, opts) {
    opts = opts || {};
    this.close();   // varsa öncekini kapat (onClose çalışır)
    this.onClose = opts.onClose || null;
    this.dismissible = opts.dismissible !== false;
    $('#modal-root').innerHTML = `<div class="overlay" data-overlay><div class="modal ${opts.cls || ''}" role="dialog" aria-modal="true">${html}</div></div>`;
    document.body.classList.add('modal-open');
    const f = $('#modal-root [data-autofocus]');
    if (f) setTimeout(() => { f.focus(); if (f.select) f.select(); }, 40);
  },
  el() { return $('#modal-root .modal'); },
  isOpen() { return !!$('#modal-root .modal'); },
  close() {
    const cb = this.onClose;
    this.onClose = null; this.dismissible = true;
    $('#modal-root').innerHTML = '';
    document.body.classList.remove('modal-open');
    if (cb) cb();
  }
};

function confirmBox(o) {
  Modal._confirm = o.onOk;
  Modal.open(`<div class="modal-head"><h3>${esc(o.title)}</h3><button class="icon-btn" data-action="close-modal" aria-label="Kapat">✕</button></div>
    <div class="modal-body"><p>${o.html || esc(o.text || '')}</p></div>
    <div class="modal-foot"><button class="btn btn-ghost" data-action="close-modal">Vazgeç</button>
    <button class="btn ${o.danger ? 'btn-danger' : 'btn-gold'}" data-action="confirm-ok">${esc(o.ok || 'Onayla')}</button></div>`);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* yedek yöntem aşağıda */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* ------------------------------ Gezinme (SPA sekmeleri) ------------------------------ */
function renderNav() {
  const live = !!Auction.live();
  const invCount = Game.inventory().length;
  const html = TABS.map(t => {
    let extra = '';
    if (t.id === 'inventory' && invCount) extra = `<span class="badge-dot">${invCount}</span>`;
    { const k = Game.openOffers().length + Game.openOrders().length; if (t.id === 'shop' && k) extra = `<span class="badge-dot">${k}</span>`; }
    if (t.id === 'auction' && live) extra = '<span class="live-dot" title="Mezat sürüyor"></span>';
    const act = UI.tab === t.id;

/* ------------------------------ Bakiye ------------------------------ */
let balShown = null, balRaf = 0, balTimer = 0;
function renderBalance(delta) {
  const val = Game.balance(), el = $('#balance-val'), box = $('#balance');
  if (balShown == null || !delta) { balShown = val; el.textContent = fmt(val); return; }
  const from = balShown, t0 = performance.now(), dur = 650;
  balShown = val;
  cancelAnimationFrame(balRaf); clearTimeout(balTimer);
  const step = t => {
    const k = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fmt(from + (val - from) * e);
    if (k < 1) balRaf = requestAnimationFrame(step);
  };
  balRaf = requestAnimationFrame(step);
  balTimer = setTimeout(() => { el.textContent = fmt(val); }, dur + 80);   // sekme arka plandaysa da doğru değer görünsün
  box.classList.remove('up', 'down'); void box.offsetWidth;
  box.classList.add(delta > 0 ? 'up' : 'down');
  setTimeout(() => box.classList.remove('up', 'down'), 800);
  const d = document.createElement('div');
  d.className = 'delta ' + (delta > 0 ? 'up' : 'down');
  d.textContent = (delta > 0 ? '+' : '−') + fmt(Math.abs(delta));
  $('#balance-wrap').appendChild(d);
  setTimeout(() => d.remove(), 1500);
}

function emptyBox(ico, title, text, extra) {
  return `<div class="empty"><div class="big">${ico}</div><b>${esc(title)}</b><p>${esc(text)}</p>${extra || ''}</div>`;
}
function chip(scope, val, ico, label, n) {
  return `<button class="chip ${UI.filter[scope] === val ? 'active' : ''}" data-action="filter" data-scope="${scope}" data-val="${esc(val)}">${ico} ${esc(label)} <em>${n}</em></button>`;
}
function condBadge(item) { return `<span class="badge">Durum: ${COND[item.condition].label}</span>`; }
function apprBadge(item) {
  if (!item.appraised) return '<span class="badge" title="Gerçekliği bilinmiyor">❔ Ekspertizsiz</span>';

function diffTag(price, ref) {
  const d = (price - ref) / ref, pct = Math.round(Math.abs(d) * 100);

}

function feedRow(e, a, isNew) {
  const cls = [isNew ? '' : 'old', e.kind === 'sys' ? 'sys' : '', e.kind === 'bid' && e.bid_id === a.top_bid_id ? 'lead' : '', e.gone ? 'gone' : ''].filter(Boolean).join(' ');

  return `<li class="${cls}"><span class="av" style="width:26px;height:26px;font-size:15px">${e.avatar}</span><span>${esc(e.name)}${e.opening ? ' <small>(açılış)</small>' : ''}</span><span class="amt">${fmt(e.amount)}</span></li>`;

function updateAuctionLive() {
  const a = Auction.live();
  const priceEl = $('#au-price');
  if (!a || !UI.auctionBuilt || !priceEl) return;
  const item = DB.get('items', a.item_instance_id);
  const txt = fmt(a.current_price);
  if (priceEl.textContent !== txt) { priceEl.textContent = txt; priceEl.classList.remove('bump'); void priceEl.offsetWidth; priceEl.classList.add('bump'); }
  const top = a.current_bidder_id ? Game.npc(a.current_bidder_id) : null;
  $('#au-who').innerHTML = top ? `<span class="av">${top.avatar}</span> ${esc(top.name)} · ${paddleNo(top)} numara` : '⏳ Teklif bekleniyor…';
  const cost = item.acquired_price || 0, diff = a.current_price - cost, plEl = $('#au-pl');
  if (top) { plEl.className = 'pl ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat'); plEl.textContent = `Şimdi satarsan: ${sgn(diff)} ${diff >= 0 ? 'kâr' : 'zarar'} · alış ${fmt(cost)}`; }
  else { plEl.className = 'pl flat'; plEl.textContent = `Alış fiyatın: ${fmt(cost)}`; }
  // müzayedeci konuşma balonu: sayım ("Bir… İki…") öncelikli, yoksa son teklif tekrarı
  const say = Auction.call ? '🔨 ' + Auction.call : (UI.say && Date.now() < UI.say.until ? UI.say.text : ''), sp = $('#au-call');
  if (sp && sp.dataset.t !== say) {
    sp.dataset.t = say; sp.textContent = say; sp.classList.toggle('hot', !!Auction.call);
    sp.style.animation = 'none'; void sp.offsetWidth; sp.style.animation = '';
  }
  $('#au-hammer').disabled = !top;
  $('#au-count').textContent = `${a.bid_count || 0} teklif`;
  Auction.paddles(a).forEach(p => {
    const el = $(`[data-pid="${p.npc.id}"]`, $('#au-paddles'));
    if (el && !el.classList.contains(p.state)) { el.classList.remove('top', 'in', 'out'); el.classList.add(p.state); }
  });
  if (UI.feedVerShown !== Auction.feedVer) {
    const prevShown = UI.feedShown;
    $('#au-feed').innerHTML = Auction.feed.map(e => feedRow(e, a, e.n > prevShown)).join('');

  }
}

// çekiç düşer: vuruş + "SATILDI" damgası; true dönerse ekran 2.6 sn sonra bekleme görünümüne döner
function hallEnd(e) {
  const hall = $('#au-hall');
  if (UI.tab !== 'auction' || !hall || !UI.auctionBuilt || e.status === 'cancelled') return false;
  UI.auctionBuilt = false;
  const sold = e.status === 'sold', st = $('#au-stamp');
  if (sold) {
    $('#au-arm').classList.add('strike'); $('#au-block').classList.add('hit');
    setTimeout(() => hall.classList.add('shake'), 420);
    $('#au-call').textContent = '🔨 Satıldı!'; $('#au-call').classList.add('hot');
    st.innerHTML = `SATILDI!<small>${e.bidder.avatar} ${esc(e.bidder.name)} · ${paddleNo(e.bidder)} numara · ${fmt(e.price)}</small>`;
  } else { st.classList.add('no'); st.textContent = 'SATILMADI'; $('#au-call').textContent = ''; }
  st.classList.add('show');
  $('#au-hammer').disabled = true;
  hallFocus(hall);
  setTimeout(() => { if (UI.tab === 'auction') renderActive(); }, sold ? 2700 : 1700);
  return true;
}
// salon ekranda tam görünmüyorsa (sayfa aşağı kaydırılmışsa) damganın görünmesi için yumuşakça yukarı al
function hallFocus(hall) {
  try {
    const r = hall.getBoundingClientRect(), top = 76;
    if (r.top >= top && r.bottom <= innerHeight - 8) return;
    const y = Math.max(0, scrollY + r.top - top);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) scrollTo(0, y); else scrollTo({ top: y, behavior: 'smooth' });
  } catch (e) { /* kaydırma olmasa da olur */ }
}

  const hist = B.history.map(h => `<li><span>Teklifin: <b>${fmt(h.amount)}</b></span><span class="${h.cls}">${esc(h.text)}</span></li>`).join('');

function openBargain(listingId) {
  const l = DB.get('market_listings', listingId);
  if (!l || l.status !== 'active') { toast('Bu eşya artık satışta değil.', 'warn'); renderMarket(); return; }
  Game.locked.add(l.id);
  UI.bargain = { id: l.id, line: pick(LINES.greet), history: [], over: null, tone: '', shake: false, suggest: niceRound(l.asking_price * 0.8) };
  Modal.open(bargainInner(), { onClose: () => { Game.locked.delete(l.id); UI.bargain = null; if (UI.tab === 'market') renderMarket(); } });
}
function refreshBargain() {
  if (!UI.bargain || !Modal.el()) return;
  Modal.el().innerHTML = bargainInner();
  const f = $('#bg-input'); if (f) { f.focus(); f.select(); }
  validateOffer();
}
function validateOffer() {
  const inp = $('#bg-input'), btn = $('#bg-offer'), hint = $('#bg-hint');
  if (!inp || !btn) return true;
  const v = Math.round(Number(inp.value)), bal = Game.balance();
  let msg = '', bad = false;
  if (!(v > 0)) { msg = 'Geçerli bir tutar yaz.'; bad = true; }
  else if (v > bal) { msg = 'Bakiyen bu teklife yetmiyor.'; bad = true; }
  inp.classList.toggle('invalid', bad); btn.disabled = bad;
  if (bad) { hint.textContent = msg; hint.className = 'hint err'; }
  else { hint.textContent = 'Çok düşük teklifler satıcının sabrını hızla tüketir.'; hint.className = 'hint'; }
  return !bad;
}
function quickOffer(pct) {
  const l = UI.bargain && DB.get('market_listings', UI.bargain.id), inp = $('#bg-input');
  if (!l || !inp) return;
  inp.value = niceRound(l.asking_price * (1 - pct / 100));
  validateOffer(); inp.focus();
}
function submitOffer() {
  const B = UI.bargain;
  if (!B || B.over || !validateOffer()) return;
  const amount = Math.round(Number($('#bg-input').value));
  const l0 = DB.get('market_listings', B.id), name = l0 ? Game.catalogOf(DB.get('items', l0.item_instance_id)).name : 'Eşya';
  const r = Game.makeOffer(B.id, amount);
  B.shake = false;
  switch (r.result) {
    case 'gone': toast(r.msg, 'warn'); Modal.close(); return;
    case 'invalid': case 'nofunds': toast(r.msg, 'warn'); return;
    case 'accepted':
      toast(`${name} — ${fmt(r.price)}${r.saved > 0 ? ` (pazarlıkla ${fmt(r.saved)} kazandın)` : ''}`, 'success', 'Anlaşma tamam!');
      B.line = r.line; B.over = 'bought'; Modal.close(); return;
    case 'countered':
      B.history.unshift({ amount, text: `Reddedildi · karşı teklif ${fmt(r.asking)}`, cls: 'warn' });
      B.line = `${r.line} (${fmt(r.asking)})`; B.tone = ''; B.shake = true;
      B.suggest = Math.min(r.asking - 5, Math.max(amount + 5, niceRound((amount + r.asking) / 2)));
      toast(`Satıcı ${fmt(r.asking)} diyor. Sabrı: %${Math.round(100 * r.patience / l0.max_patience)}`, 'warn', 'Pazarlık reddedildi');
      break;
    case 'insulted':
      B.history.unshift({ amount, text: 'Reddedildi · çok düşük!', cls: 'neg' });
      B.line = r.line; B.tone = 'angry'; B.shake = true;
      B.suggest = niceRound(Math.max(amount * 1.25, l0.asking_price * 0.7));
      toast('Teklifin çok düşük, satıcı sinirlendi!', 'error', 'Pazarlık reddedildi');
      break;
    case 'walked':
      B.history.unshift({ amount, text: 'Satıcı çekildi', cls: 'neg' });
      B.line = r.line; B.tone = 'angry'; B.shake = true; B.over = 'walked';
      toast('Satıcının sabrı tükendi, satış iptal oldu.', 'error', 'Satıcı pazarlıktan çekildi');
      break;
  }
  if (B.suggest < 5) B.suggest = 5;
  refreshBargain();
  if (UI.tab === 'market') renderMarket();
}

/* ---------- 08-sound.js ---------- */
/* =====================================================================
   BÖLÜM 8 — SES: WebAudio ile sentezlenen mezat atmosferi (hiçbir ses dosyası yok)
   • Kalabalık uğultusu: formant (ünlü) sentezli 14 konuşmacı → 9 sn'lik döngü; teklif hızına göre
     yükselir, "Bir… İki…" sayımında susar. Mezat sekmesinde canlı mezat varken çalar.
   • Çekiç: ahşap blok kipleri (modal sentez) + çatırtı + gövde; salon yankısı (ConvolverNode).
   • Alkış, "ooo/aaa" koro tepkileri, kürek (paddle) hışırtısı, çan, para, red/uyarı sesleri.
   Tarayıcılar sesi ilk dokunuşa kadar kilitli tutar; ilk tıkta açılır. Tercihler localStorage'da.
   ===================================================================== */
const Sound = (() => {
  const KEY = 'bitpazari_ses_v1';
  const P = { vol: 0.8, muted: false, crowd: true, fx: true };
  try { Object.assign(P, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* özel pencere vb. */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) { /* yok say */ } };
  const AC = window.AudioContext || window.webkitAudioContext, OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const R = Math.random, rr = (a, b) => a + R() * (b - a), now = () => Date.now();

  /* ---------- temel parçalar ---------- */
  const NB = new WeakMap(), AB = new WeakMap(), SB = new WeakMap();   // SB: gerçek kayıtlar (crowd/applause) bağlam başına
  function sampleBufs(c) {            // gömülü mp3 kayıtlarını çöz; hata olursa sentez devam eder
    let p = SB.get(c); if (p) return p;
    p = { crowd: null, applause: null, ready: null }; SB.set(c, p);
    const dec = k => { try { if (typeof SND_DATA === 'undefined' || !SND_DATA[k]) return Promise.resolve(); const bin = atob(SND_DATA[k]), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return c.decodeAudioData(u.buffer).then(b => { p[k] = b; }).catch(() => {}); } catch (e) { return Promise.resolve(); } };
    p.ready = Promise.all([dec('crowd'), dec('applause')]); return p;
  }
  function noiseBuf(c) {
    let b = NB.get(c);
    if (!b) { b = c.createBuffer(1, Math.floor(c.sampleRate * 2), c.sampleRate); const d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; NB.set(c, b); }
    return b;
  }
  function impulse(c, sec, decay) {   // salon yankısı: üstel sönen, giderek kararan gürültü
    const n = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); let lp = 0; for (let i = 0; i < n; i++) { lp += ((R() * 2 - 1) * Math.pow(1 - i / n, decay) - lp) * (.55 - .4 * i / n); d[i] = lp; } }
    return b;
  }
  function applauseBuf(c) {           // alkış: gerçek kayıt varsa o; yoksa yoğunluk zarflı gürültü + tek tek el çırpma darbeleri
    const sp = SB.get(c); if (sp && sp.applause) return sp.applause;
    let b = AB.get(c); if (b) return b;
    const sec = 3.4, sr = c.sampleRate, n = Math.floor(sr * sec);
    b = c.createBuffer(2, n, sr);
    const dens = t => Math.min(1, t / .3) * Math.exp(-Math.max(0, t - .8) / 1.05);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let l1 = 0, l2 = 0;
      for (let i = 0; i < n; i++) { l1 += ((R() * 2 - 1) - l1) * .24; l2 += (l1 - l2) * .24; d[i] = (l1 - l2) * 0.55 * dens(i / sr); }
      for (let k = 0; k < sec * 85; k++) {
        const t0 = R() * sec; if (R() > dens(t0)) continue;
        const i0 = Math.floor(t0 * sr), len = Math.floor(sr * rr(.005, .018)), amp = rr(.25, .8); let a1 = 0, a2 = 0, a3 = 0;   // el çırpma: ~0.5–3 kHz bandına sınırlı kısa patlama
        for (let j = 0; j < len && i0 + j < n; j++) { const w = R() * 2 - 1; a1 += (w - a1) * .3; a3 += (a1 - a3) * .3; a2 += (w - a2) * .07; d[i0 + j] += (a3 - a2) * 3.2 * amp * Math.exp(-j / (len * .32)) * .5; }
      }
    }
    AB.set(c, b); return b;
  }
  function buses(c) {                 // canlı ve çevrimdışı render aynı grafiği kullanır
    const master = c.createGain(), comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = .003; comp.release.value = .2;
    master.connect(comp); comp.connect(c.destination);
    const verb = c.createConvolver(); verb.buffer = impulse(c, 1.8, 3.4);
    const vo = c.createGain(); vo.gain.value = .9; verb.connect(vo); vo.connect(master);
    const mk = send => { const g = c.createGain(), dry = c.createGain(), s = c.createGain(); s.gain.value = send; g.connect(dry); dry.connect(master); g.connect(s); s.connect(verb); return g; };
    return { master, fx: mk(.26), crowd: mk(.32) };
  }
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); };
  function tone(c, out, t, o) {       // kısa sinüs/üçgen/kare vuruş; f2 verilirse frekans süzülür
    const x = c.createOscillator(), g = c.createGain(), a = o.a || .003;
    x.type = o.type || 'sine'; x.frequency.setValueAtTime(o.f, t);
    if (o.f2) x.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || o.d));
    env(g, t, a, o.v, o.d); x.connect(g); g.connect(out); x.start(t); x.stop(t + a + o.d + .05);
  }
  function burst(c, out, t, o) {      // süzülmüş gürültü patlaması
    const n = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(), a = o.a || .002;
    n.buffer = noiseBuf(c); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1; f.frequency.setValueAtTime(o.f, t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + (o.glide || o.d));
    env(g, t, a, o.v, o.d); n.connect(f); f.connect(g); g.connect(out); n.start(t, R() * 1.5); n.stop(t + a + o.d + .05);

  const panner = (c, out, pan) => { if (!c.createStereoPanner) return out; const p = c.createStereoPanner(); p.pan.value = pan; p.connect(out); return p; };
  const VOW = { a: [730, 1090, 2440], e: [530, 1840, 2480], i: [270, 2290, 3010], o: [570, 840, 2410], u: [300, 870, 2240] };

  /* ---------- efektler: (bağlam, hedef düğüm, başlangıç zamanı, ...) ---------- */
  const FX = {
    gavel(c, out, t, v = 1) {         // ahşap blok + tokmak: kip frekansları + çatırtı + gövde
      const g = c.createGain(); g.gain.value = .85 * v; g.connect(out);
      [[330, 1, .15], [760, .7, .1], [1320, .5, .06], [2280, .36, .035], [3400, .22, .02]].forEach(([f, a, d]) => tone(c, g, t, { f: f * rr(.985, 1.015), v: a * .5, a: .0012, d: d * 1.6 }));
      tone(c, g, t, { f: 150, f2: 62, glide: .09, v: .8, a: .001, d: .16 });

    },
    paddle(c, out, t, pan = 0, v = 1) {   // kürek kalkarken hışırtı + küçük tık

      tone(c, o, t + .09, { type: 'triangle', f: 900 * rr(.9, 1.1), v: .13 * v, a: .002, d: .05 });
    },
    applause(c, out, t, power = 1) {
      const s = c.createBufferSource(), g = c.createGain();
      s.buffer = applauseBuf(c); s.playbackRate.value = rr(.97, 1.03); g.gain.value = .8 * power;
      const real = !!(SB.get(c) && SB.get(c).applause), lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = real ? 16000 : 4200; lp.Q.value = .5;

    },
    ooh(c, out, t, o) {               // koro "oooh/aaah": formant süzgeçli çok sesli testere dalgası

      mix.gain.setValueAtTime(gain, t + dur); mix.gain.exponentialRampToValueAtTime(.0001, t + dur + rel);

    },
    bell(c, out, t, v = 1) { [[2093, 1, 1.5], [3136, .5, 1], [4186, .3, .6], [5274, .15, .4]].forEach(([f, a, d]) => tone(c, out, t, { f, v: .22 * a * v, a: .001, d })); },
    coin(c, out, t, v = 1) {          // "ka-ching": iki metalik vuruş + bozuk para şıngırtısı
      [[0, 2637, 3520], [.085, 3520, 4699]].forEach(([dt, f1, f2]) => { tone(c, out, t + dt, { f: f1, v: .2 * v, a: .001, d: .45 }); tone(c, out, t + dt, { f: f2 * 1.003, v: .12 * v, a: .001, d: .3 }); tone(c, out, t + dt, { f: f1 * 2.76, v: .05 * v, a: .001, d: .12 }); });
      burst(c, out, t, { type: 'highpass', f: 6000, q: .7, v: .12 * v, a: .001, d: .12 });
      for (let k = 0; k < 4; k++) tone(c, out, t + .18 + k * .045 + R() * .02, { f: rr(3400, 5200), v: .07 * v, a: .001, d: .09 });
    },
    buy(c, out, t, v = 1) {           // satın alma: tok + iki inen para sesi
      tone(c, out, t, { f: 170, f2: 70, glide: .08, v: .5 * v, a: .001, d: .14 }); burst(c, out, t, { f: 1800, q: .8, v: .25 * v, a: .001, d: .03 });
      [0, .07, .13].forEach((dt, i) => tone(c, out, t + .06 + dt, { f: 3000 - i * 450, v: .09 * v, a: .001, d: .12 }));
    },
    deny(c, out, t, v = 1) {          // red: alçak "bzzt"
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700; f.connect(out);
      tone(c, f, t, { type: 'square', f: 110, f2: 92, glide: .22, v: .2 * v, a: .004, d: .22 }); tone(c, f, t, { type: 'sawtooth', f: 117, f2: 98, glide: .22, v: .15 * v, a: .004, d: .22 });
    },
    warn(c, out, t, v = 1) { [560, 420].forEach((f, i) => tone(c, out, t + i * .13, { f, v: .2 * v, a: .004, d: .16 })); },
    success(c, out, t, v = 1) { [660, 880].forEach((f, i) => tone(c, out, t + i * .08, { type: 'triangle', f, v: .18 * v, a: .004, d: .32 })); },
    click(c, out, t, v = 1) { tone(c, out, t, { type: 'triangle', f: 1100, f2: 700, glide: .03, v: .06 * v, a: .001, d: .035 }); }
  };

  /* ---------- kalabalık uğultusu: 14 konuşmacıdan oluşan, çevrimdışı üretilen döngü ---------- */
  async function makeBabble(sec) {
    sec = sec || 9;
    const sr = 22050, oc = new OAC(2, sr * sec, sr), nb = noiseBuf(oc), out = oc.createGain();
    out.gain.value = .5; out.connect(oc.destination);
    for (let s = 0; s < 14; s++) {
      const f0 = R() < .6 ? rr(90, 150) : rr(165, 255), osc = oc.createOscillator(), nz = oc.createBufferSource(), nzg = oc.createGain();
      const mix = oc.createGain(), amp = oc.createGain(), pan = panner(oc, out, rr(-.9, .9));
      osc.type = 'sawtooth'; osc.frequency.value = f0; nz.buffer = nb; nz.loop = true; nzg.gain.value = .35; amp.gain.value = .0001;
      osc.connect(mix); nz.connect(nzg); nzg.connect(mix); amp.connect(pan);
      const fs = [[9, 1], [11, .55], [13, .3]].map(([q, g]) => { const f = oc.createBiquadFilter(), fg = oc.createGain(); f.type = 'bandpass'; f.Q.value = q; f.frequency.value = 700; fg.gain.value = g; mix.connect(f); f.connect(fg); fg.connect(amp); return f; });
      const vowels = Object.values(VOW);
      let t = R() * 1.5;
      while (t < sec - .5) {
        const syl = 3 + Math.floor(R() * 5), vol = rr(.6, 1);
        for (let k = 0; k < syl && t < sec - .5; k++) {
          const v = vowels[Math.floor(R() * 5)], dur = rr(.09, .22);
          osc.frequency.setTargetAtTime(f0 * rr(.88, 1.18), t, .03);
          fs.forEach((f, i) => f.frequency.setTargetAtTime(v[i] * rr(.96, 1.04), t, .02));
          amp.gain.setTargetAtTime(vol * rr(.55, 1), t, .015); amp.gain.setTargetAtTime(.0001, t + dur, .03);
          t += dur + rr(.03, .08);
        }
        t += rr(.25, 1.7);
      }
      osc.start(0); nz.start(0);
    }
    const buf = await oc.startRendering();
    let sq = 0, cnt = 0, pk = 0;   // ses düzeyini sabitle (RMS ≈ .16, tepe ≤ .9) ve döngü uçlarını yumuşat
    for (let ch = 0; ch < buf.numberOfChannels; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > pk) pk = a; if (i % 7 === 0) { sq += d[i] * d[i]; cnt++; } } }
    const k = Math.min(.16 / Math.max(.0005, Math.sqrt(sq / cnt)), .9 / Math.max(.001, pk)), fade = Math.floor(sr * .04);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { let w = k; if (i < fade) w *= i / fade; else if (i > d.length - fade) w *= (d.length - i) / fade; d[i] *= w; } }
    return buf;
  }

  /* ---------- durum + canlı grafik ---------- */
  let ctx = null, B = null, babblePromise = null, ambTimer = null;
  const st = { want: false, crowdOn: false, nodes: null, excite: 0, hush: 1, hushT: 1, sfxAt: 0, endAt: 0, bids: 0 };
  const gainOf = () => (P.muted ? 0 : Math.pow(P.vol, 1.5) * .95);
  const babble = () => babblePromise || (babblePromise = (async () => {
    const sp = sampleBufs(ctx); await sp.ready;
    return sp.crowd || makeBabble();
  })().catch(e => { babblePromise = null; throw e; }));

  function unlock() {
    try {
      if (!AC) return;
      if (!ctx) {
        ctx = new AC({ latencyHint: 'interactive' }); B = buses(ctx); B.master.gain.value = gainOf(); B.crowd.gain.value = P.crowd ? 1 : 0;
        setTimeout(() => { try { sampleBufs(ctx); applauseBuf(ctx); babble(); } catch (e) { /* ses yok */ } }, 50);
        ambTimer = setInterval(tickCrowd, 220);
        if (st.want) startCrowd();
      }
      if (ctx.state === 'suspended' && !P.muted && !document.hidden) ctx.resume();
    } catch (e) { ctx = null; }
  }
  function at(delay, name, ...args) {   // efekti (gecikmeli) çal; sessizdeyse hiçbir şey yapma
    try {
      if (!ctx || P.muted || !P.fx || ctx.state !== 'running' && ctx.state !== 'suspended') return;
      st.sfxAt = now();
      FX[name](ctx, B.fx, ctx.currentTime + .01 + (delay || 0), ...args);
    } catch (e) { /* ses hatası oyunu bozmasın */ }
  }
  function quiet(name, ...args) { try { if (ctx && !P.muted && P.fx) FX[name](ctx, B.fx, ctx.currentTime + .005, ...args); } catch (e) { /* yok say */ } }

  function startCrowd() {

      const real = buf !== null && ctx && SB.get(ctx) && SB.get(ctx).crowd === buf;
      const srcs = (real ? [[1, -.5, 0], [1.012, .5, buf.duration * .5]] : [[1, -.45, 0], [.973, .45, 4.3]]).map(([rate, pan, off]) => {
        const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.playbackRate.value = rate;

      });

      rn.connect(rf); rf.connect(rg); rg.connect(lp); rn.start();

    }).catch(() => { st.crowdOn = false; });
  }
  function stopCrowd() {
    st.crowdOn = false;
    const n = st.nodes; if (!n || !ctx) return;
    st.nodes = null; const t = ctx.currentTime;
    n.gain.gain.cancelScheduledValues(t); n.gain.gain.setTargetAtTime(.0001, t, .25);

  function tickCrowd(fast) {            // her 220 ms: coşku sönümü + kalabalık düzeyi/parlaklığı

  }

  /* ---------- oyun olaylarını dinle ---------- */
  function wire() {
    Bus.on('auction:start', () => { st.excite = .35; st.hushT = 1; st.hush = 1; st.bids = 0; at(0, 'bell'); at(.5, 'gavel', .55); });
    Bus.on('auction:bid', d => {
      let pan = 0;
      try { const ps = Auction.paddles(d.auction), i = ps.findIndex(p => p.npc.id === d.bidder.id); pan = ps.length > 1 ? i / (ps.length - 1) * 1.5 - .75 : 0; } catch (e) { /* pan yok */ }

      if (st.bids % 4 === 0) at(.12, 'ooh', { v: 'a', n: 5, dur: .7, gain: .2, f0: 160, glide: .06, pan });
    });
    Bus.on('auction:withdraw', () => { st.excite = Math.min(1, st.excite + .5); at(0, 'ooh', { v: 'o', n: 7, dur: 1, gain: .3, glide: -.22 }); at(.05, 'deny', .45); });
    Bus.on('auction:call', d => {       // "Bir…" "İki…": salon susar, tokmak hafifçe vurur
      st.hushT = d.text.startsWith('İki') ? .25 : d.text ? .5 : 1;
      if (d.text.startsWith('İki')) { at(0, 'gavel', .38); at(.22, 'gavel', .38); } else if (d.text) at(0, 'gavel', .3);
    });
    Bus.on('auction:end', e => {
      st.hushT = 1; st.endAt = now();
      if (e.status === 'sold') {
        const big = Math.min(1, .45 + Math.max(0, e.profit) / Math.max(1, e.price) * 1.2);
        at(.4, 'gavel', 1); at(.58, 'gavel', .5);
        at(.62, 'applause', .6 + .4 * big); at(.55, 'ooh', { v: 'a', n: 9, dur: 1.1, gain: .26 + .16 * big, f0: 170, glide: .08 });
        at(1.4, 'coin', .9); st.excite = 1;
      } else if (e.status === 'unsold') { at(.1, 'ooh', { v: 'o', n: 6, dur: 1.2, gain: .2, glide: -.25 }); at(.25, 'deny', .6); }
      else at(0, 'click');
    });
    Bus.on('balance', d => setTimeout(() => {     // mezat satışı kendi sesini çalar; diğerleri için para sesi
      if (now() - st.endAt < 1500) return;
      if (d.delta > 0) at(0, 'coin', .8); else if (d.delta < 0) at(0, 'buy', .9);
    }, 0));
    document.addEventListener('click', e => { if (e.target.closest('button:not(:disabled), .chip, [data-tab], .tab')) quiet('click'); }, true);
    ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, unlock, { passive: true }));

      if (!ctx) return;
      if (document.hidden) ctx.suspend(); else if (!P.muted) ctx.resume();

  }

  /* ---------- dışa açılan arayüz ---------- */
  const api = {
    prefs: P,
    wire, unlock,
    ambience(on) { st.want = !!on; if (!ctx) return; if (on) startCrowd(); else stopCrowd(); },
    toast(type) {                        // bildirim sesi: başka bir ses çalındıysa susar

    },
    toggleMute() {

      api.refreshButton(); if (!P.muted) quiet('click');

    set(key, val) {
      if (key === 'muted') { if (P.muted !== !!val) api.toggleMute(); return; }
      P[key] = val; save();
      if (ctx) {
        if (key === 'vol') B.master.gain.setTargetAtTime(gainOf(), ctx.currentTime, .05);
        if (key === 'crowd') { B.crowd.gain.setTargetAtTime(val ? 1 : 0, ctx.currentTime, .1); if (val && st.want) startCrowd(); if (!val) stopCrowd(); }
      }
      api.refreshButton();
    },
    test(name) {                         // ayar ekranındaki "dene" düğmeleri
      unlock();
      if (P.muted) return false;
      if (name === 'gavel') { at(0, 'gavel', 1); at(.2, 'gavel', .5); }
      else if (name === 'applause') { at(0, 'applause', 1); at(0, 'ooh', { v: 'a', n: 8, dur: 1, gain: .3, f0: 170, glide: .08 }); }
      else if (name === 'crowd') { st.excite = .8; api.ambience(true); setTimeout(syncAmbience, 4200); }
      else if (name === 'coin') at(0, 'coin');
      return true;
    },
    icon() { return P.muted ? '🔇' : P.vol < .35 ? '🔈' : P.vol < .7 ? '🔉' : '🔊'; },
    refreshButton() { const b = document.getElementById('snd-btn'); if (b) { b.textContent = api.icon(); b.classList.toggle('off', P.muted); b.setAttribute('aria-pressed', String(!P.muted)); b.title = P.muted ? 'Sesi aç' : 'Sesi kapat'; } },
    mountButton() {
      const menu = document.querySelector('[data-action="menu"]');
      if (!menu || document.getElementById('snd-btn')) return;
      const b = document.createElement('button'); b.id = 'snd-btn'; b.type = 'button'; b.className = 'snd-btn'; b.dataset.action = 'snd-toggle'; b.setAttribute('aria-label', 'Sesi aç/kapat');
      menu.parentNode.insertBefore(b, menu); api.refreshButton();
    },
    /* --- test/analiz için --- */
    async render(name, secs, args) {     // efekti çevrimdışı çalıp AudioBuffer döndürür
      const oc = new OAC(2, Math.ceil(44100 * (secs || 3)), 44100), b = buses(oc); b.master.gain.value = 1;
      if (name === 'applause') await sampleBufs(oc).ready;
      FX[name](oc, b.fx, .02, ...(args || [])); return oc.startRendering();
    },
    async renderCrowd(secs, excite) {    // kalabalık uğultusunu (canlı zincirle aynı) çevrimdışı çalar
      const oc = new OAC(2, Math.ceil(44100 * (secs || 4)), 44100), sp = sampleBufs(oc); await sp.ready; const buf = sp.crowd || await makeBabble(), b = buses(oc), lp = oc.createBiquadFilter(), g = oc.createGain();
      lp.type = 'lowpass'; lp.frequency.value = 1100 + 3200 * excite; g.gain.value = (.2 + .8 * excite) * .9 * (sp.crowd ? 2.4 : 1); lp.connect(g); g.connect(b.crowd); b.master.gain.value = 1;
      const s = oc.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(lp); s.start(0); return oc.startRendering();
    },
    debug() { return { state: ctx && ctx.state, crowdOn: st.crowdOn, nodes: !!st.nodes, want: st.want, excite: +st.excite.toFixed(2), hush: +st.hush.toFixed(2), muted: P.muted, vol: P.vol, sfxAt: st.sfxAt }; }
  };
  return api;
})();

   Her ürün 240×180'lik bir sahnede çizilir; motor arka plan, zemin, spot ışığı, vinyet ve film
   greni ekler. Gerçek fotoğrafa geçmek için catalog_items.image_url doldurulması yeterlidir
   (örn. Supabase Storage adresi) — doluysa SVG yerine o görsel kullanılır.
   ===================================================================== */
const ART = {};   // ürün id → () => SVG parçası

// kategori → [spot merkezi, kenar karanlığı, zemin rengi]
const ART_BG = {
  'Ev Eşyası':        ['#7a604a', '#1f1712', '#46301f'],
  'Seramik & Cam':    ['#4d6a80', '#0f1820', '#27394a'],
  'Saat & Mekanik':   ['#6a5e52', '#17130f', '#33291f'],
  'Askeri':           ['#586a52', '#12170f', '#2b3622'],
  'Halı & Tekstil':   ['#7b5050', '#1d1010', '#3b2423'],
  'Kâğıt & Kitap':    ['#7d6f50', '#1c170d', '#3a2e1b'],

  'Mücevher & Sikke': ['#385a6b', '#0a141a', '#1f3541'],
  'Oyuncak':          ['#8a7458', '#1c150e', '#4d3b27'],
  'Müzik & Ses':      ['#6e5240', '#170f0b', '#3a261b'],
  'Bilim & Seyahat':  ['#4f6a64', '#0e1715', '#243a35']
};

// malzemeler: açıktan koyuya 4 ton
const MAT = {
  gold:    ['#fff5c2', '#f1c75b', '#b9801f', '#6e4510'],
  silver:  ['#ffffff', '#d5dae2', '#8f97a3', '#4b525d'],
  brass:   ['#ffeeb0', '#dfae4a', '#a2701f', '#5d390b'],
  copper:  ['#ffd9b8', '#e08a52', '#a04a22', '#5c2610'],
  wood:    ['#d3a06a', '#9a6634', '#65401d', '#3b230d'],
  walnut:  ['#a9744a', '#6d4325', '#442712', '#27150a'],
  steel:   ['#f2f5f8', '#aeb7c2', '#6c7683', '#363c46'],
  black:   ['#55555e', '#2a2a30', '#141418', '#08080a'],
  cobalt:  ['#9cc0ff', '#3b6fd4', '#1b3f94', '#0b1f55'],
  glass:   ['#ffffff', '#d4e9f4', '#93b8cc', '#557a8c'],
  clay:    ['#e7ae84', '#bd6c3d', '#80411f', '#46210d'],
  cream:   ['#fffaf0', '#f4e8ca', '#d9c392', '#a68e5a'],
  leather: ['#9a5440', '#63311f', '#3d1c12', '#21100b'],
  velvet:  ['#6d2a3a', '#4a1727', '#2d0c18', '#16060c'],
  red:     ['#ff9d8c', '#dc3d2d', '#a01d14', '#580b07'],
