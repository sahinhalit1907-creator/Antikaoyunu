<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<title>Bit Pazarı &amp; Mezat — Antika Simülasyonu</title>
<style>
/* ===================== TEMA ===================== */
:root{--bg:#0c0e13;--bg2:#11141b;--surface:#161a23;--surface2:#1c212c;--surface3:#262d3c;--border:#2a3243;--border2:#38425a;--text:#eaedf4;--muted:#9aa4ba;--faint:#6d778e;--gold:#e3b45f;--gold2:#f4d08a;--green:#4cc38a;--red:#ff6b6b;--blue:#5aa9ff;--purple:#b58cff;--orange:#ffa94d;--radius:16px;--shadow:0 14px 40px rgba(0,0,0,.45);--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(900px 520px at 8% -8%,rgba(227,180,95,.09),transparent 60%),radial-gradient(800px 480px at 100% 100%,rgba(90,169,255,.07),transparent 60%),var(--bg);background-attachment:fixed;color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.modal-open{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed}
input,select{font:inherit;color:inherit}
h1,h2,h3,h4,p,ul{margin:0;padding:0}
ul{list-style:none}
small{color:var(--muted);font-size:12.5px}
s{color:var(--faint);font-size:.7em;font-weight:600}
b{font-weight:700}
.muted{color:var(--muted)}

/* ===================== ÜST ÇUBUK ===================== */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:calc(10px + var(--safe-t)) 16px 10px;background:rgba(12,14,19,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:linear-gradient(145deg,#2b2417,#1a1710);border:1px solid rgba(227,180,95,.4);box-shadow:0 0 18px rgba(227,180,95,.15)}
.brand b{display:block;font-family:var(--serif);font-size:17px;line-height:1.1}
.brand small{display:block;font-size:11.5px;letter-spacing:.4px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.balance-wrap{position:relative}
.balance{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--border2);font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2);transition:background .3s,border-color .3s,transform .3s}
.balance.up{background:rgba(76,195,138,.16);border-color:rgba(76,195,138,.6);transform:scale(1.04)}
.balance.down{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.55);transform:scale(.98)}
.delta{position:absolute;right:6px;top:100%;margin-top:4px;font-weight:800;font-size:13px;pointer-events:none;white-space:nowrap;animation:floatUp 1.5s ease-out forwards}
.delta.up{color:var(--green)}.delta.down{color:var(--red)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border);font-size:18px;transition:background .15s;flex:0 0 auto}
.icon-btn:hover{background:var(--surface3)}

/* ===================== SEKMELER ===================== */
.tabs{display:flex}
.tabs-top{display:none;gap:4px;margin-left:18px}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:9px 4px 8px;color:var(--muted);font-size:11.5px;font-weight:700;transition:color .15s,background .15s}
.tab-ico{font-size:20px;line-height:1}
.tab.active{color:var(--gold2)}
.tabs-top .tab{flex:0 0 auto;flex-direction:row;gap:8px;padding:9px 16px;border-radius:12px;font-size:14px}
.tabs-top .tab:hover{background:var(--surface)}
.tabs-top .tab.active{background:var(--surface2);box-shadow:inset 0 0 0 1px var(--border2)}
.tabs-bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:var(--safe-b);background:rgba(14,16,22,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border)}
.tabs-bottom .tab.active::before{content:"";position:absolute;top:0;left:24%;right:24%;height:3px;border-radius:0 0 4px 4px;background:var(--gold)}
.badge-dot{position:absolute;top:4px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#1a1405;font-size:11px;font-weight:800;display:grid;place-items:center}
.tabs-top .badge-dot{position:static}
.live-dot{position:absolute;top:8px;left:calc(50% + 10px);width:9px;height:9px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
.tabs-top .live-dot{position:static}

/* ===================== DÜZEN ===================== */
.main{max-width:1180px;margin:0 auto;padding:18px 16px calc(96px + var(--safe-b))}
.view{display:none}
.view.active{display:block;animation:fadeIn .28s ease}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px;flex-wrap:wrap}
.view-head h2{font-family:var(--serif);font-size:26px;line-height:1.15}
.sub{color:var(--muted);font-size:14px}
h3.sec{font-family:var(--serif);font-size:19px;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:700;white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.active{background:rgba(227,180,95,.14);border-color:rgba(227,180,95,.55);color:var(--gold2)}
.chip em{font-style:normal;font-size:11.5px;font-weight:800}
.trend.up{color:var(--green)}.trend.down{color:var(--red)}.trend.flat{color:var(--faint)}
.empty{grid-column:1/-1;text-align:center;padding:40px 16px;border:1px dashed var(--border2);border-radius:var(--radius);color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.empty .btn{margin-top:14px}

/* ===================== KARTLAR ===================== */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:var(--radius);background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.25);transition:transform .18s,border-color .18s,box-shadow .18s;--rar:#9aa4ba;--rar-rgb:154,164,186}
.card:hover{transform:translateY(-2px);border-color:rgba(var(--rar-rgb),.55);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.r-common{--rar:#9aa4ba;--rar-rgb:154,164,186}
.r-uncommon{--rar:#4cc38a;--rar-rgb:76,195,138}
.r-rare{--rar:#5aa9ff;--rar-rgb:90,169,255}
.r-epic{--rar:#b58cff;--rar-rgb:181,140,255}
.r-legendary{--rar:#ffb347;--rar-rgb:255,179,71}
.card.r-epic,.card.r-legendary{box-shadow:0 8px 26px rgba(var(--rar-rgb),.14)}
.ribbon{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:var(--rar);background:rgba(var(--rar-rgb),.12);border:1px solid rgba(var(--rar-rgb),.4)}
.ribbon.new{right:auto;left:12px;top:-9px;color:#1a1405;background:var(--gold);border-color:var(--gold)}
.item-head{display:flex;gap:12px;align-items:center;padding-right:76px}
.tile{flex:0 0 auto;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 30% 20%,rgba(var(--rar-rgb),.32),rgba(var(--rar-rgb),.06) 70%),var(--surface2);border:1px solid rgba(var(--rar-rgb),.45);box-shadow:inset 0 0 18px rgba(var(--rar-rgb),.12);--rar:#9aa4ba;--rar-rgb:154,164,186}
.tile.sm{width:46px;height:46px;font-size:24px;border-radius:13px}
.tile.lg{width:72px;height:72px;font-size:38px;border-radius:20px}
.item-name{font-family:var(--serif);font-size:17px;line-height:1.2;font-weight:700}
.item-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--surface3);color:var(--muted);border:1px solid var(--border)}
.badge.good{color:var(--green);background:rgba(76,195,138,.12);border-color:rgba(76,195,138,.4)}
.badge.bad{color:var(--red);background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.4)}
.badge.warn{color:var(--orange);background:rgba(255,169,77,.12);border-color:rgba(255,169,77,.4)}
.badge.gold{color:var(--gold2);background:rgba(227,180,95,.12);border-color:rgba(227,180,95,.4)}
.desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.seller{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:var(--surface3);border:1px solid var(--border2);flex:0 0 auto}
.av.lg{width:46px;height:46px;font-size:26px}
.seller b{font-size:13.5px;display:block;line-height:1.2}
.seller .mood{margin-left:auto;font-size:20px}
.pricebox{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.price{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold2);line-height:1}
.price-cap{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.guide{font-size:12.5px;color:var(--muted);text-align:right}
.diff{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:700}
.diff.good{color:var(--green);background:rgba(76,195,138,.12)}
.diff.bad{color:var(--red);background:rgba(255,107,107,.12)}
.diff.neutral{color:var(--muted);background:var(--surface3)}
.appr{font-size:13px;color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px dashed var(--border2)}
.appr b{color:var(--gold2)}
.actions{display:flex;gap:8px;margin-top:auto}
.actions .btn{flex:1}

/* ===================== BUTONLAR ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:12px;font-weight:800;font-size:14.5px;line-height:1.1;border:1px solid transparent;transition:transform .12s,filter .15s,background .15s,opacity .15s;user-select:none;text-align:center}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.42}
.btn-primary{background:linear-gradient(180deg,#58d49a,#3faa77);color:#06210f}
.btn-gold{background:linear-gradient(180deg,#f0c778,#c99a45);color:#201603}
.btn-primary:hover:not(:disabled),.btn-gold:hover:not(:disabled){filter:brightness(1.08)}
.btn-ghost{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.btn-ghost:hover:not(:disabled){background:var(--surface3)}
.btn-danger{background:rgba(255,107,107,.14);border-color:rgba(255,107,107,.5);color:#ff9a9a}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.grow{flex:1}
.btn-block{width:100%}

/* ===================== ANİMASYONLAR ===================== */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes floatUp{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.6)}50%{box-shadow:0 0 0 7px rgba(255,107,107,0)}}
@keyframes popIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes hammer{0%{transform:rotate(0)}30%{transform:rotate(-38deg)}60%{transform:rotate(14deg)}100%{transform:rotate(0)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(227,180,95,.45)}50%{box-shadow:0 0 0 8px rgba(227,180,95,0)}}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ===================== BİLDİRİMLER (TOAST) ===================== */
.toasts{position:fixed;top:calc(68px + var(--safe-t));right:14px;z-index:120;display:flex;flex-direction:column;gap:8px;width:min(370px,calc(100vw - 28px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--border2);border-left:4px solid var(--blue);box-shadow:var(--shadow);animation:toastIn .28s ease;font-size:14px;line-height:1.35;cursor:pointer}
.toast.success{border-left-color:var(--green)}.toast.error{border-left-color:var(--red)}.toast.warn{border-left-color:var(--orange)}.toast.gold{border-left-color:var(--gold)}
.toast.out{animation:toastOut .25s ease forwards}
.toast .t-ico{font-size:18px;line-height:1.25}
.toast b{display:block;margin-bottom:1px}

/* ===================== MODAL ===================== */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,6,10,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fadeIn .18s ease}
.modal{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border2);border-radius:22px 22px 0 0;box-shadow:var(--shadow);animation:popIn .24s ease}
.modal.wide{max-width:740px}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-head h3{flex:1;font-family:var(--serif);font-size:20px}
.modal-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px calc(12px + var(--safe-b));border-top:1px solid var(--border);background:var(--bg2)}
.modal-foot .btn{flex:1 1 auto}

/* ===================== PAZARLIK ===================== */
.bg-seller{display:flex;gap:12px;align-items:center}
.bubble{position:relative;flex:1;padding:10px 13px;border-radius:14px 14px 14px 4px;background:var(--surface2);border:1px solid var(--border2);font-size:14px;font-style:italic;min-height:48px;display:flex;align-items:center}
.bubble.shake{animation:shake .4s}
.bubble.angry{border-color:rgba(255,107,107,.6);background:rgba(255,107,107,.08)}
.bubble.happy{border-color:rgba(76,195,138,.6);background:rgba(76,195,138,.08)}
.meter{height:10px;border-radius:99px;background:var(--surface3);overflow:hidden;border:1px solid var(--border)}
.meter>i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#9be15d);transition:width .45s ease,background .3s}
.meter.mid>i{background:linear-gradient(90deg,var(--orange),#ffd166)}
.meter.low>i{background:linear-gradient(90deg,var(--red),#ff9a5a)}
.meter-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.offer-box{display:flex;gap:8px}
.field{position:relative;flex:1}
.field span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--gold2);font-weight:800}
.field input{width:100%;padding:12px 12px 12px 31px;border-radius:12px;background:var(--bg2);border:1px solid var(--border2);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;outline:none;-moz-appearance:textfield}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(227,180,95,.18)}
.field input.invalid{border-color:var(--red)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{padding:6px 11px;border-radius:999px;background:var(--surface2);border:1px solid var(--border2);font-size:12.5px;font-weight:800;color:var(--muted);transition:all .15s}
.quick button:hover{color:var(--text);border-color:var(--gold)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv>div{padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--border)}
.kv small{display:block}
.kv b{font-size:18px;font-variant-numeric:tabular-nums}
.hist{display:flex;flex-direction:column;gap:6px;max-height:140px;overflow-y:auto}
.hist li{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.err{color:var(--red)}
.hint.ok{color:var(--green)}

/* ===================== MEZAT SAHNESİ ===================== */
.stage{display:grid;gap:14px;grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{padding:16px;border-radius:var(--radius);background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--border)}
.panel h4{font-family:var(--serif);font-size:17px;margin-bottom:10px}
.hero{display:flex;gap:16px;align-items:center;background:radial-gradient(500px 200px at 0% 0%,rgba(227,180,95,.12),transparent 70%),linear-gradient(180deg,var(--surface),var(--bg2))}
.hero .big{font-size:46px}
.hero p{color:var(--muted);font-size:14px}
.hero b{color:var(--gold2)}
.hero-price{text-align:center;padding:18px 10px;border-radius:18px;background:radial-gradient(circle at 50% 0%,rgba(227,180,95,.22),transparent 70%),var(--bg2);border:1px solid rgba(227,180,95,.38)}
.hero-price small{text-transform:uppercase;letter-spacing:.8px;font-size:11px}
.hero-price .amount{font-size:clamp(38px,9vw,60px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--gold2);line-height:1.1;letter-spacing:-1px}
.hero-price .amount.bump{animation:bump .35s ease}
.hero-price .who{margin-top:6px;display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:var(--surface2);border:1px solid var(--border2);font-weight:700;font-size:14px}
.hero-price .who .av{width:26px;height:26px;font-size:15px}
.hero-price .pl{margin-top:8px;font-size:13.5px;font-weight:700}
.pl.up{color:var(--green)}.pl.down{color:var(--red)}.pl.flat{color:var(--muted)}
.call{min-height:34px;text-align:center;font-family:var(--serif);font-size:24px;font-weight:700;color:var(--orange);letter-spacing:.3px}
.hammer-btn{width:100%;padding:18px;font-size:21px;border-radius:16px;letter-spacing:.5px}
.hammer-btn:not(:disabled){animation:glow 1.8s infinite}
.hammer-btn .hm{display:inline-block;transform-origin:70% 85%}
.hammer-btn:hover:not(:disabled) .hm{animation:hammer .5s ease}
.feed{display:flex;flex-direction:column;gap:6px;max-height:300px;overflow-y:auto}
.feed li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--border);font-size:13.5px;animation:fadeIn .25s}
.feed li .amt{margin-left:auto;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;white-space:nowrap}
.feed li.sys{color:var(--orange);border-style:dashed}
.feed li.lead{border-color:rgba(76,195,138,.6);background:rgba(76,195,138,.08)}
.feed li.old{animation:none}
.feed li.gone{opacity:.55}
.feed li.gone .amt{text-decoration:line-through}
.paddles{display:flex;gap:6px;flex-wrap:wrap}
.paddle{display:flex;align-items:center;gap:6px;padding:4px 11px 4px 5px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px;font-weight:700;transition:opacity .3s,border-color .3s}
.paddle .av{width:26px;height:26px;font-size:15px}
.paddle.out{opacity:.35;text-decoration:line-through}
.paddle.top{border-color:var(--green);box-shadow:0 0 0 2px rgba(76,195,138,.22)}

/* ===================== ENVANTER / DEFTER ===================== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.stat small{display:block;text-transform:uppercase;letter-spacing:.5px;font-size:11px}
.stat b{display:block;margin-top:2px;font-size:20px;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:14px}
.row .amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.row .ico{font-size:22px;width:34px;text-align:center}
.amt.pos,.pos{color:var(--green)}.amt.neg,.neg{color:var(--red)}
.note{padding:14px;border-radius:14px;background:var(--surface);border:1px dashed var(--border2);color:var(--muted);font-size:13.5px}
.note .btn{margin-top:10px;margin-right:6px}
pre.sql{margin:0;padding:14px;border-radius:12px;background:#0a0c10;border:1px solid var(--border);color:#c9d3e8;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;max-height:52vh;white-space:pre}
.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{justify-content:flex-start;padding:14px 16px;text-align:left}
.howto{display:flex;flex-direction:column}
.howto li{padding:9px 0;border-bottom:1px solid var(--border);color:var(--muted);font-size:14px}
.howto li:last-child{border-bottom:0}
.howto li b{color:var(--text)}

/* ===================== DUYARLI DÜZEN ===================== */
@media(min-width:640px){
  .overlay{align-items:center;padding:20px}
  .modal{border-radius:22px}
  .modal-foot{border-radius:0 0 22px 22px}
}
@media(min-width:900px){
  .tabs-top{display:flex}
  .tabs-bottom{display:none}
  .main{padding-bottom:48px}
  .topbar{padding-left:24px;padding-right:24px}
  .stage{grid-template-columns:1.2fr 1fr}
}

  .brand small{display:none}
  .balance{padding:7px 11px;font-size:14px}
  .view-head h2{font-size:22px}

  .grid{grid-template-columns:1fr}
  .item-head{padding-right:70px}
  .hero{flex-direction:column;text-align:center}
}

/* ===================== ÜRÜN FOTOĞRAFLARI ===================== */
.ribbon{z-index:3;background:rgba(10,12,18,.74);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ribbon.new{background:var(--gold)}
.item-head{padding-right:0}
.photo{position:relative;margin:-14px -14px 0;aspect-ratio:3/2;overflow:hidden;border-radius:calc(var(--radius) - 1px) calc(var(--radius) - 1px) 0 0;background:#0c0e13;border-bottom:1px solid rgba(var(--rar-rgb),.4);isolation:isolate}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s ease,filter .3s;user-select:none;-webkit-user-drag:none}
.card:hover .photo img{transform:scale(1.045)}
.photo::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 58%,rgba(0,0,0,.38)),radial-gradient(120% 90% at 50% 0%,rgba(var(--rar-rgb),.13),transparent 60%)}
.cond-poor img{filter:sepia(.4) saturate(.76) contrast(.94) brightness(.9)}
.photo.cond-poor::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 11px,rgba(255,255,255,.055) 11px 12px,transparent 12px 27px),radial-gradient(circle at 78% 70%,rgba(60,30,10,.38),transparent 28%),radial-gradient(circle at 18% 30%,rgba(60,30,10,.28),transparent 22%)}
.cond-fair img{filter:sepia(.16) saturate(.92)}
.cond-excellent img{filter:saturate(1.1) contrast(1.05) brightness(1.04)}
.photo.cond-excellent::before{content:"";position:absolute;inset:-40% -60%;z-index:1;pointer-events:none;background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.17) 50%,transparent 58%);animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-34%)}100%{transform:translateX(34%)}}
.stamp{position:absolute;z-index:2;left:12px;bottom:12px;padding:3px 10px;border:2px solid currentColor;border-radius:6px;font:800 12px/1.1 var(--serif,Georgia),serif;letter-spacing:2px;text-transform:uppercase;transform:rotate(-8deg);background:rgba(0,0,0,.42);box-shadow:0 0 0 1px rgba(0,0,0,.45)}
.stamp.fake{color:#ff6b6b}.stamp.genuine{color:#4cc38a}.stamp.exceptional{color:#ffcf66}
.thumb{flex:0 0 auto;position:relative;width:58px;height:58px;border-radius:15px;overflow:hidden;border:1px solid rgba(var(--rar-rgb),.5);background:#0c0e13;box-shadow:0 0 14px rgba(var(--rar-rgb),.18);--rar:#9aa4ba;--rar-rgb:154,164,186}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:46px;height:46px;border-radius:12px}
.thumb.lg{width:76px;height:76px;border-radius:18px}

/* ===================== MEZAT SALONU (görsel simülasyon) ===================== */
.hall{position:relative;border-radius:20px;overflow:hidden;border:1px solid #3d2a22;background:#120a0c;box-shadow:0 14px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.04);aspect-ratio:5/4;isolation:isolate;container-type:inline-size;user-select:none}
.hall.shake{animation:hall-shake .38s ease}
@keyframes hall-shake{0%,100%{transform:none}20%{transform:translate(-.5cqw,.4cqw)}40%{transform:translate(.6cqw,-.3cqw)}60%{transform:translate(-.3cqw,.3cqw)}80%{transform:translate(.2cqw,-.2cqw)}}
.hall-back{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(0,0,0,.55),transparent 22%),
  repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2.4cqw,rgba(255,255,255,.045) 2.4cqw 4.8cqw,rgba(0,0,0,.3) 4.8cqw 7.2cqw),
  linear-gradient(180deg,#3a1018,#5a1a26 45%,#2b0c13)}
.hall-back::before{content:"";position:absolute;left:0;right:0;top:0;height:3.4cqw;background:linear-gradient(180deg,#e3b45f,#a8782c);box-shadow:0 .8cqw 1.6cqw rgba(0,0,0,.5)}
.hall-back::after{content:"";position:absolute;left:0;right:0;top:3.4cqw;height:2.6cqw;background:repeating-linear-gradient(90deg,#c9953f 0 .5cqw,transparent .5cqw 2.2cqw);opacity:.55;-webkit-mask:linear-gradient(180deg,#000,transparent);mask:linear-gradient(180deg,#000,transparent)}
.hall-stagefloor{position:absolute;left:0;right:0;top:60%;height:6%;background:linear-gradient(180deg,#7a5230,#4a2f19 70%,#2a1a0e);box-shadow:0 -.4cqw 1.2cqw rgba(0,0,0,.4)}
.hall-stagefloor::after{content:"";position:absolute;left:0;right:0;top:0;height:.5cqw;background:rgba(255,236,190,.35)}
.hall-floor{position:absolute;left:0;right:0;top:66%;bottom:0;background:linear-gradient(180deg,#22121a,#0d0709)}
.hall-spot{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse 30% 46% at 70% 36%,rgba(255,236,180,.34),transparent 72%),radial-gradient(ellipse 22% 36% at 20% 36%,rgba(255,226,170,.16),transparent 70%)}
.podium{position:absolute;z-index:3;left:2cqw;bottom:34cqw;width:31cqw}
.podium svg{width:100%;height:auto;display:block;overflow:visible}
.podium .arm{transform-origin:60px 66px;transform:rotate(38deg)}
.podium .arm.strike{animation:arm-strike .8s cubic-bezier(.3,.1,.4,1)}
@keyframes arm-strike{0%{transform:rotate(38deg)}24%{transform:rotate(8deg)}50%{transform:rotate(140deg)}58%{transform:rotate(130deg)}68%{transform:rotate(140deg)}100%{transform:rotate(38deg)}}
.podium .block.hit{animation:block-hit .3s ease .4s}
@keyframes block-hit{0%{filter:none}30%{filter:brightness(2.2)}100%{filter:none}}
.speech{position:absolute;z-index:5;left:1.4cqw;top:7.6cqw;max-width:56cqw;padding:.9cqw 2.4cqw;border-radius:2.4cqw;background:#fff6dc;color:#2a1608;font:700 3.5cqw/1.25 var(--serif,Georgia),serif;box-shadow:0 .8cqw 2cqw rgba(0,0,0,.45);animation:speech-pop .22s ease}
.speech:empty{display:none}
.speech::after{content:"";position:absolute;left:5cqw;top:100%;border:1.4cqw solid transparent;border-top-color:#fff6dc;border-bottom:0}
.speech.hot{background:#ffe1a8;color:#5a1d08}
@keyframes speech-pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.lot{position:absolute;z-index:2;right:4cqw;bottom:35cqw;width:50cqw}
.lot .photo{margin:0;border-radius:1.4cqw;border:.7cqw solid #c9953f;box-shadow:0 0 0 .3cqw #6e4510,0 1.6cqw 4cqw rgba(0,0,0,.6),0 0 6cqw rgba(255,226,160,.22);aspect-ratio:3/2}
.lot .photo .stamp{font-size:2.6cqw;left:1.6cqw;bottom:1.6cqw;padding:.4cqw 1.6cqw;border-width:.35cqw;letter-spacing:.4cqw}
.lot .plinth{height:5cqw;margin:0 -2cqw;border-radius:.8cqw .8cqw 0 0;background:linear-gradient(180deg,#8a5a2c,#4a2f19);box-shadow:0 1cqw 2cqw rgba(0,0,0,.55);position:relative}
.lot .plinth::before{content:"";position:absolute;left:1cqw;right:1cqw;top:.5cqw;height:.4cqw;background:rgba(255,236,190,.4);border-radius:.2cqw}
.lot .plinth span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:1.6cqw;font:700 2.5cqw/1 var(--serif,Georgia),serif;color:#f3d9a0;letter-spacing:.2cqw;white-space:nowrap;overflow:hidden;padding:0 2cqw}
.lot .plinth b{flex:none;padding:.5cqw 1.5cqw;border-radius:.8cqw;background:#120a0c;border:.25cqw solid #c9953f;color:#ffe2a6;font:800 2cqw/1.2 system-ui,sans-serif;letter-spacing:.3cqw}
.lot .plinth i{font-style:normal;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sold-stamp{position:absolute;z-index:6;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-10deg) scale(2.4);opacity:0;pointer-events:none;text-align:center;font:900 9cqw/1 var(--serif,Georgia),serif;letter-spacing:.4cqw;color:#ff5a4d;border:.8cqw solid currentColor;border-radius:1.6cqw;padding:.8cqw 3cqw 1cqw;background:rgba(20,6,8,.6);text-shadow:0 0 2cqw rgba(255,90,77,.5);white-space:nowrap}
.sold-stamp small{display:block;font:700 3cqw/1.2 system-ui,sans-serif;letter-spacing:.2cqw;color:#ffe6d0;margin-top:.8cqw;text-shadow:none}
.sold-stamp.no{color:#b8c0d2;text-shadow:none;font-size:7cqw}
.sold-stamp.show{animation:stamp-in .42s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp-in{0%{opacity:0;transform:translate(-50%,-50%) rotate(-10deg) scale(2.4)}60%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(.92)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-10deg) scale(1)}}
.crowd{position:absolute;z-index:4;left:0;right:0;bottom:1.4cqw;height:31cqw;display:flex;justify-content:center;align-items:flex-end;gap:1cqw;padding:0 2.4cqw}
.crowd-back{position:absolute;z-index:3;left:0;right:0;bottom:21cqw;height:12cqw;display:flex;justify-content:space-evenly;align-items:flex-end;padding:0 4cqw;opacity:.9}
.ghost{width:7cqw;height:10cqw;position:relative;animation:sway 5s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
.ghost::before{content:"";position:absolute;left:1.4cqw;top:0;width:4.2cqw;height:4.4cqw;border-radius:50%;background:hsl(var(--h,25) 25% 24%)}
.ghost::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5.8cqw;border-radius:3.4cqw 3.4cqw 0 0;background:hsl(var(--h,25) 20% 16%)}
.seat,.seat.paddle{position:relative;isolation:isolate;flex:1 1 0;max-width:14.4cqw;min-width:0;display:flex;flex-direction:column;align-items:center;gap:0;padding:6.4cqw 0 0;border:0;border-radius:0;background:none;box-shadow:none;font-size:inherit;text-decoration:none;animation:sway 4.2s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%;transition:filter .3s,opacity .3s}
.seat::before{content:"";position:absolute;z-index:-1;left:9%;right:9%;top:9.6cqw;bottom:-2.4cqw;border-radius:5cqw 5cqw 0 0;background:linear-gradient(180deg,#46222f,#2a1219 70%,#1a0b10);box-shadow:inset 0 .6cqw .8cqw rgba(255,255,255,.08),inset 0 0 0 .3cqw rgba(0,0,0,.35),0 -.2cqw 1cqw rgba(0,0,0,.4);transition:background .3s,box-shadow .3s}
.seat.top::before{background:linear-gradient(180deg,#5a2c3a,#341822 70%,#1f0e14);box-shadow:inset 0 .6cqw .8cqw rgba(255,255,255,.1),inset 0 0 0 .35cqw rgba(227,180,95,.5),0 0 3cqw rgba(227,180,95,.22)}
.seat.paddle.top{border:0;box-shadow:none}
@keyframes sway{0%,100%{transform:rotate(-1.2deg) translateY(0)}50%{transform:rotate(1.2deg) translateY(-.5cqw)}}
.seat .av{width:10cqw;height:10cqw;font-size:6cqw;border:.35cqw solid #5a4636;background:radial-gradient(circle at 35% 30%,#4a4256,#1c1822);box-shadow:0 .6cqw 1.6cqw rgba(0,0,0,.55);transition:border-color .3s,box-shadow .3s,filter .3s}
.seat .no{position:absolute;right:calc(50% - 7.6cqw);top:13cqw;min-width:4cqw;padding:0 .8cqw;border-radius:1cqw;background:#0b0708;border:.25cqw solid #6a5238;color:#e8d2a2;font:800 2.3cqw/3.2cqw system-ui,sans-serif;text-align:center}
.seat .nm{margin-top:.8cqw;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 2.5cqw/1.2 system-ui,sans-serif;color:#d9cfc0;text-shadow:0 1px 2px #000}
.seat .sign{position:absolute;left:50%;top:0;width:7cqw;height:5.2cqw;margin-left:-3.5cqw;border-radius:.9cqw;background:linear-gradient(180deg,#fffaf0,#ead9a6);color:#3a2410;font:900 3.3cqw/5.2cqw var(--serif,Georgia),serif;text-align:center;box-shadow:0 .5cqw 1.4cqw rgba(0,0,0,.55);transform:translateY(5cqw) scale(.5);opacity:0;pointer-events:none;transition:transform .32s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.seat .sign::after{content:"";position:absolute;left:50%;top:100%;width:.6cqw;height:3.6cqw;margin-left:-.3cqw;background:#7a5226;border-radius:.3cqw}
.seat.top .sign,.seat.bidding .sign{opacity:1;transform:translateY(-.4cqw) rotate(-7deg) scale(1.12)}
.seat.top .av{border-color:#e3b45f;box-shadow:0 0 0 .5cqw rgba(227,180,95,.35),0 0 4cqw rgba(227,180,95,.5)}
.seat.top .nm{color:#ffe2a6}
.seat.out,.seat.paddle.out{filter:grayscale(1) brightness(.6);opacity:.55;text-decoration:none}
.seat.out .nm{text-decoration:line-through}
.seat.bidding::after{content:attr(data-amt);position:absolute;left:50%;top:-5.4cqw;z-index:7;padding:.3cqw 1.6cqw;border-radius:1.4cqw;background:#e3b45f;color:#241505;font:900 3.2cqw/1.3 system-ui,sans-serif;white-space:nowrap;transform:translate(-50%,0);animation:amt-float 1.5s ease-out forwards}
@keyframes amt-float{0%{opacity:0;transform:translate(-50%,2.4cqw) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-6cqw) scale(1)}}
.seat.gone{animation:shake .45s}
.hall-live{display:inline-flex;align-items:center;gap:6px}
.lot-info{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lot-info .item-head{flex:1 1 220px}
.hero-price{background:radial-gradient(circle at 50% 0%,rgba(255,176,60,.2),transparent 70%),#0b0c10;border:1px solid #3d3326;box-shadow:inset 0 0 30px rgba(0,0,0,.6)}
.hero-price .amount{color:#ffb73c;text-shadow:0 0 18px rgba(255,160,40,.55);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hammer-btn{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:12;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.snd-btn{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:18px;cursor:pointer;transition:background .15s,transform .15s}

/* ---------- DÜKKAN / MÜZE ---------- */
.shop-prog{margin-bottom:14px}
.museum{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--border2);background:#150d14;padding:18px 14px 0;isolation:isolate}
.m-wall{position:absolute;inset:0;z-index:-1;background:
  radial-gradient(120% 70% at 50% -10%,rgba(255,225,160,.16),transparent 60%),

.walker{position:absolute;bottom:var(--y,0);left:-8%;font-size:30px;line-height:1;animation:walk var(--s,18s) linear infinite;animation-delay:var(--d,0s);filter:drop-shadow(0 4px 3px rgba(0,0,0,.6))}

@keyframes walk{0%{left:-8%}100%{left:104%}}
.buy-cab{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}

.offer{align-items:center}

.offer-act .amt{margin-right:4px}
.inv-display{margin-top:6px}
@media (prefers-reduced-motion:reduce){.walker{animation:none;left:calc(10% + var(--y,0px)*6)}}

.orders{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.order{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:linear-gradient(160deg,#241a2a,#161019);border:1px solid var(--border2);position:relative}
.order::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,#c9953f,#f3d9a0,#c9953f)}
.o-who{display:flex;align-items:center;gap:10px}
.o-who>div:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.o-who small{color:var(--muted);font-size:12px}
.o-budget{text-align:right}
.o-budget small{display:block}

.order .bubble{margin:0}

/* ------------------------------ yardımcılar ------------------------------ */
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function wpick(entries) {            // [[değer, ağırlık], ...]
  const total = entries.reduce((s, e) => s + e[1], 0);
  let r = Math.random() * total;
  for (const [v, w] of entries) { r -= w; if (r <= 0) return v; }
  return entries[entries.length - 1][0];
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function niceRound(n) {              // "pazar" fiyatı gibi yuvarla
  n = Math.max(0, n);
  if (n < 100) return Math.max(5, Math.round(n / 5) * 5);
  if (n < 1000) return Math.round(n / 10) * 10;
  if (n < 10000) return Math.round(n / 25) * 25;
  if (n < 30000) return Math.round(n / 50) * 50;
  return Math.round(n / 100) * 100;
}
const fmt = n => '₺' + Math.round(n).toLocaleString('tr-TR');
const sgn = n => (n >= 0 ? '+' : '−') + fmt(Math.abs(n));
const uid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const nowIso = () => new Date().toISOString();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

// Çok basit olay yolu (pub/sub): oyun mantığı arayüzü bu kanaldan haberdar eder
const Bus = {
  h: {},
  on(e, f) { (this.h[e] = this.h[e] || []).push(f); },
  emit(e, d) { (this.h[e] || []).forEach(f => { try { f(d); } catch (err) { console.error('[Bus]', e, err); } }); }
};

const TABLES = ['players', 'npcs', 'catalog_items', 'items', 'market_listings', 'offers', 'auctions', 'bids', 'transactions', 'shops', 'shop_offers', 'orders'];

const SCHEMA_SQL = `-- Supabase / PostgreSQL şeması — oyundaki veri modelinin karşılığı
create extension if not exists "pgcrypto";

  owner_type      text not null check (owner_type in ('npc','player')),

-- Online sürümde: row level security + gerçek zamanlı abonelik
-- alter table bids enable row level security;
-- supabase.channel('auction:'||id).on('postgres_changes',{event:'INSERT',table:'bids'},cb).subscribe();
`;

const DB = {
  t: {}, meta: {}, _timer: null,
  init() {
    TABLES.forEach(n => { this.t[n] = []; });
    this.meta = { schema_version: CFG.SCHEMA_VERSION, player_id: null, day: 1, tutorial_done: false, created_at: nowIso() };
  },
  insert(table, row) {
    row.id = row.id || uid();
    row.created_at = row.created_at || nowIso();
    this.t[table].push(row);
    this.dirty();
    return row;
  },
  get(table, id) { return this.t[table].find(r => r.id === id) || null; },
  find(table, fn) { return fn ? this.t[table].filter(fn) : this.t[table].slice(); },
  one(table, fn) { return this.t[table].find(fn) || null; },
  update(table, id, patch) { const r = this.get(table, id); if (!r) return null; Object.assign(r, patch); this.dirty(); return r; },
  remove(table, id) { const i = this.t[table].findIndex(r => r.id === id); if (i >= 0) { this.t[table].splice(i, 1); this.dirty(); } },
  dirty() { clearTimeout(this._timer); this._timer = setTimeout(() => this.save(), 350); },
  save() {
    clearTimeout(this._timer);
    try { localStorage.setItem(CFG.SAVE_KEY, JSON.stringify({ meta: this.meta, t: this.t })); return true; } catch (e) { return false; }
  },
  load() {
    try {
      const raw = localStorage.getItem(CFG.SAVE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (!d || !d.t || !d.meta || d.meta.schema_version !== CFG.SCHEMA_VERSION || !d.meta.player_id) return false;
      this.init();
      this.meta = Object.assign(this.meta, d.meta);
      TABLES.forEach(n => { this.t[n] = Array.isArray(d.t[n]) ? d.t[n] : []; });
      return !!this.get('players', this.meta.player_id);
    } catch (e) { return false; }
  },
  wipe() { clearTimeout(this._timer); try { localStorage.removeItem(CFG.SAVE_KEY); } catch (e) { /* yoksay */ } },
  exportJSON() { return JSON.stringify({ meta: this.meta, tables: this.t }, null, 2); }
};
