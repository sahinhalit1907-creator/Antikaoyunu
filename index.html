  yellow:  ['#fff3ad', '#f2cb4c', '#bb8c1b', '#6c4a08'],
  blue:    ['#a9d0ff', '#4a86d8', '#2354a0', '#0e2a5c'],
  skin:    ['#fbe0c8', '#efc29c', '#c98f66', '#8a5a3a'],
  fur:     ['#e0b37a', '#b9843f', '#85561f', '#4a2d0f']
};
const stopsOf = m => MAT[m] || m;
// doğrusal degrade: yön 'v' yukarıdan aşağı, 'h' soldan sağa, 'd' çapraz
function G(id, m, dir) {
  const c = stopsOf(m), v = dir === 'h' ? [0, 0, 1, 0] : dir === 'd' ? [0, 0, 1, 1] : [0, 0, 0, 1];
  return `<linearGradient id="${id}" x1="${v[0]}" y1="${v[1]}" x2="${v[2]}" y2="${v[3]}">${c.map((col, i) => `<stop offset="${(i / (c.length - 1)).toFixed(2)}" stop-color="${col}"/>`).join('')}</linearGradient>`;
}
// silindirik gövde: kenarlar koyu, solda parlak vurgu
function C(id, m) {
  const c = stopsOf(m);
  return `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${c[2]}"/><stop offset=".28" stop-color="${c[0]}"/><stop offset=".55" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[3]}"/></linearGradient>`;
}
// yuvarlak/kubbe: ışık sol üstten gelir
function R(id, m, cx, cy) {
  const c = stopsOf(m);
  return `<radialGradient id="${id}" cx="${cx || 0.35}" cy="${cy || 0.3}" r=".8"><stop offset="0" stop-color="${c[0]}"/><stop offset=".4" stop-color="${c[1]}"/><stop offset=".75" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[3]}"/></radialGradient>`;
}
// zemin gölgesi
const SH = (cx, cy, rx, ry) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry || Math.max(4, rx * 0.16)}" fill="url(#sh)"/>`;
// tekrarlanabilir deterministik "rastgele" (madeni paralar, lekeler için)
function seeded(seed) { let s = seed; return () => { s = (s * 16807) % 2147483647; return s / 2147483647; }; }

// n köşeli yıldız: points dizgesi
function STAR(cx, cy, r1, r2, n, rot) {
  const p = [];
  for (let i = 0; i < n * 2; i++) { const a = (rot === undefined ? -Math.PI / 2 : rot) + i * Math.PI / n, r = i % 2 ? r2 : r1; p.push((cx + r * Math.cos(a)).toFixed(1) + ',' + (cy + r * Math.sin(a)).toFixed(1)); }
  return p.join(' ');
}
const F1 = n => (+n).toFixed(1);

function artSVG(id, category) {
  const bg = ART_BG[category] || ART_BG['Ev Eşyası'];
  const body = ART[id] ? ART[id]() : '<text x="120" y="104" text-anchor="middle" font-size="44">🏺</text>';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice"><defs>
<radialGradient id="bg" cx=".5" cy=".42" r=".8"><stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/></radialGradient>
<linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${bg[2]}"/><stop offset="1" stop-color="#000" stop-opacity=".8"/></linearGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".7"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<radialGradient id="sp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff0c8" stop-opacity=".36"/><stop offset="1" stop-color="#fff0c8" stop-opacity="0"/></radialGradient>
<radialGradient id="vg" cx=".5" cy=".48" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".66"/></radialGradient>
<filter id="gr" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="11"/><feColorMatrix type="matrix" values="0 0 0 0 .95  0 0 0 0 .9  0 0 0 0 .8  0 0 0 1.3 -.42"/></filter>
</defs>
<rect width="240" height="180" fill="url(#bg)"/>
<rect y="124" width="240" height="56" fill="url(#fl)"/>
<rect y="123.2" width="240" height="1.4" fill="#fff" opacity=".14"/>
<ellipse cx="120" cy="70" rx="116" ry="84" fill="url(#sp)"/>
${body}
<rect width="240" height="180" fill="url(#vg)"/>
<rect width="240" height="180" filter="url(#gr)" opacity=".3"/>
</svg>`;
}

const ART_CACHE = {};
function artURL(cat) {   // cat: katalog satırı
  if (cat.image_url) return cat.image_url;
  if (!ART_CACHE[cat.id]) ART_CACHE[cat.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(artSVG(cat.id, cat.category));
  return ART_CACHE[cat.id];
}

  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
};

// mohair / tüy dokusu: elips içine küçük kısa fırça darbeleri
function artGfur(seed, cx, cy, rx, ry, n, len) {
  const r = seeded(seed); let d = '';
  for (let i = 0; i < n; i++) {
    const a = r() * 6.283, k = Math.sqrt(r()), x = cx + Math.cos(a) * rx * k * .94, y = cy + Math.sin(a) * ry * k * .94, t = r() * 6.283;
    d += `M${F1(x)} ${F1(y)}l${F1(Math.cos(t) * len)} ${F1(Math.sin(t) * len)}`;
  }
  return d;
}

ART['chess-set'] = () => {
  // tahta: perspektif yamuk; (u,v) → ekran koordinatı (v=0 arka, v=8 ön)
  const TL = [66, 70], TR = [176, 70], BR = [214, 132], BL = [28, 132];
  const pt = (u, v) => { const a = u / 8, b = v / 8, x0 = TL[0] + (TR[0] - TL[0]) * a, y0 = TL[1] + (TR[1] - TL[1]) * a, x1 = BL[0] + (BR[0] - BL[0]) * a, y1 = BL[1] + (BR[1] - BL[1]) * a; return [x0 + (x1 - x0) * b, y0 + (y1 - y0) * b]; };
  let cells = '';
  for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
    const p = [pt(c, r), pt(c + 1, r), pt(c + 1, r + 1), pt(c, r + 1)].map(q => F1(q[0]) + ',' + F1(q[1])).join(' ');
    cells += `<polygon points="${p}" fill="${(r + c) % 2 ? '#3a1f10' : '#e6cf9c'}"/>`;
  }
  const piece = (type, u, v, col) => {
    const [x, y] = pt(u + .5, v + .5), s = .52 + v * .075, fill = col === 'w' ? 'url(#iv)' : 'url(#eb)', st = col === 'w' ? '#6b5a36' : '#000', hi = col === 'w' ? '#fff' : '#c8b898';
    const base = `<ellipse cx="0" cy="0" rx="9" ry="3.2" fill="${fill}" stroke="${st}" stroke-width=".7"/><path d="M-8 0Q-8 -3 -5 -5H5Q8 -3 8 0Z" fill="${fill}" stroke="${st}" stroke-width=".7"/>`;
    const bodies = {
      pawn: `<path d="M-4.6 -5Q-2 -10 -2.6 -16H2.6Q2 -10 4.6 -5Z" fill="${fill}" stroke="${st}" stroke-width=".7"/><rect x="-4" y="-18" width="8" height="2.6" rx="1.2" fill="${fill}" stroke="${st}" stroke-width=".6"/><circle cx="0" cy="-23" r="5" fill="${fill}" stroke="${st}" stroke-width=".7"/>`,
      rook: `<path d="M-5.6 -5L-4.4 -26H4.4L5.6 -5Z" fill="${fill}" stroke="${st}" stroke-width=".7"/><path d="M-6.4 -26V-33H-3.4V-30H-1.4V-33H1.4V-30H3.4V-33H6.4V-26Z" fill="${fill}" stroke="${st}" stroke-width=".6"/><rect x="-6.4" y="-26.6" width="12.8" height="2" fill="${fill}" stroke="${st}" stroke-width=".5"/>`,
      bishop: `<path d="M-5 -5Q-2.4 -14 -3 -22H3Q2.4 -14 5 -5Z" fill="${fill}" stroke="${st}" stroke-width=".7"/><rect x="-4.6" y="-24" width="9.2" height="2.6" rx="1.2" fill="${fill}" stroke="${st}" stroke-width=".6"/><path d="M0 -42Q7 -34 5 -27Q0 -24 -5 -27Q-7 -34 0 -42Z" fill="${fill}" stroke="${st}" stroke-width=".7"/><path d="M1.2 -37L-2.6 -31" stroke="${st}" stroke-width="1.1"/><circle cx="0" cy="-43.6" r="1.8" fill="${fill}" stroke="${st}" stroke-width=".5"/>`,
      king: `<path d="M-6 -5Q-3 -16 -4 -28H4Q3 -16 6 -5Z" fill="${fill}" stroke="${st}" stroke-width=".7"/><rect x="-5.6" y="-30" width="11.2" height="3" rx="1.4" fill="${fill}" stroke="${st}" stroke-width=".6"/><path d="M-6 -30Q-7 -38 -3 -41H3Q7 -38 6 -30Z" fill="${fill}" stroke="${st}" stroke-width=".7"/><path d="M0 -50V-41M-3.2 -47H3.2" stroke="${st}" stroke-width="2.6" stroke-linecap="round"/><path d="M0 -50V-41M-3.2 -47H3.2" stroke="${fill === 'url(#iv)' ? '#f4ead0' : '#4a4a52'}" stroke-width="1.2" stroke-linecap="round"/>`
    };
    return `<g transform="translate(${F1(x)} ${F1(y)}) scale(${s.toFixed(2)})"><ellipse cx="3" cy="1.4" rx="10" ry="3" fill="#000" opacity=".35"/>${base}${bodies[type]}<path d="M-2.6 -14V-24" stroke="${hi}" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/></g>`;
  };
  // arkadan öne doğru çiz (derinlik sırası)
  const set = [['king', 3, 0, 'b'], ['bishop', 5, 0, 'b'], ['rook', 0, 1, 'b'], ['pawn', 2, 1, 'b'], ['pawn', 4, 1, 'b'], ['pawn', 6, 2, 'b'], ['pawn', 1, 5, 'w'], ['rook', 6, 5, 'w'], ['pawn', 3, 6, 'w'], ['king', 4, 6, 'w'], ['pawn', 5, 7, 'w']]
    .sort((a, b) => a[2] - b[2]).map(p => piece(...p)).join('');
  const fr = [[TL[0] - 5, TL[1] - 5], [TR[0] + 5, TR[1] - 5], [BR[0] + 9, BR[1] + 8], [BL[0] - 9, BL[1] + 8]].map(q => q.join(',')).join(' ');
  return `<defs>${G('iv', ['#fffdf4', '#f1e6c6', '#cdb98a', '#8d7a4c'], 'h')}${G('eb', ['#5a5a62', '#2c2c32', '#131316', '#050506'], 'h')}${G('fw', ['#8a5a2e', '#5f3a1b', '#3a200c', '#1d0e04'], 'v')}</defs>
${SH(120, 142, 96)}
<polygon points="${fr}" fill="url(#fw)" stroke="#120802" stroke-width="1"/><polygon points="${[TL, TR, BR, BL].map(q => q.join(',')).join(' ')}" fill="#120802"/>
${cells}
<path d="M${TL[0]} ${TL[1]}L${TR[0]} ${TR[1]}" stroke="#fff" stroke-opacity=".25" stroke-width="1"/>
${set}`;
};

/* =====================================================================
   BÖLÜM 8 — OLAYLAR, EYLEMLER VE BAŞLATMA
   ===================================================================== */
function doBuy(id) {
  const r = Game.buy(id);
  if (!r.ok) { toast(r.msg, 'error', 'Satın alınamadı'); renderMarket(); return; }
  toast(`${r.cat.name} — ${fmt(r.price)}`, 'success', 'Satın alındı');
}
function doAppraise(itemId) {
  const r = Game.appraise(itemId);
  if (!r.ok) { toast(r.msg, 'warn'); return; }
  const a = AUTH[r.item.authenticity];
  toast(`${r.cat.name}: ${a.label}, gerçek değeri ≈ ${fmt(niceRound(r.item.true_value))} (ücret ${fmt(r.fee)})`,
    r.item.authenticity === 'fake' ? 'error' : r.item.authenticity === 'exceptional' ? 'gold' : 'success', `Ekspertiz sonucu ${a.ico}`);
}
function doDealer(id) {
  const item = DB.get('items', id);
  if (!item) return;
  const cat = Game.catalogOf(item), q = Game.dealerQuote(item);
  confirmBox({
    title: 'Tüccara satılsın mı?',
    html: `<b>${esc(cat.name)}</b> için Tüccar Mehmet <b>${fmt(q)}</b> ödüyor. Mezat genellikle çok daha iyi öder; bu seçenek hızlı nakit içindir.`,
    ok: `${fmt(q)} al`,
    onOk: () => {
      const r = Game.sellToDealer(id);
      if (!r.ok) { toast(r.msg, 'warn'); return; }
      toast(`${r.cat.name} — ${fmt(r.price)} (${r.profit >= 0 ? 'kâr' : 'zarar'} ${fmt(Math.abs(r.profit))})`, r.profit >= 0 ? 'success' : 'warn', 'Tüccara satıldı');
    }
  });
}
function resetGame() {
  Auction.stop(); Game.locked.clear(); DB.wipe(); Game.newGame();
  balShown = null; UI.filter = { market: 'all', inv: 'all' }; UI.bargain = null;
  renderBalance(); switchTab('market');
  toast('Yeni oyun başladı. Bol kazançlar!', 'success', 'Oyun sıfırlandı');
}

const ACTIONS = {
  'close-modal': () => Modal.close(),
  'confirm-ok': () => { const f = Modal._confirm; Modal._confirm = null; Modal.close(); if (f) f(); },
  filter: el => { UI.filter[el.dataset.scope] = el.dataset.val; if (el.dataset.scope === 'market') renderMarket(); else renderInventory(); },
  buy: el => doBuy(el.dataset.id),
  bargain: el => openBargain(el.dataset.id),
  offer: () => submitOffer(),
  quick: el => quickOffer(Number(el.dataset.pct)),
  'buy-now': el => {
    const r = Game.buy(el.dataset.id);
    if (!r.ok) { toast(r.msg, 'error', 'Satın alınamadı'); return; }
    toast(`${r.cat.name} — ${fmt(r.price)}`, 'success', 'Satın alındı');
    if (UI.bargain) UI.bargain.over = 'bought';
    Modal.close();
  },
  appraise: el => doAppraise(el.dataset.id),
  'display-quick': el => { const r = Game.displayItem(el.dataset.id); if (!r.ok) { toast(r.msg, 'warn', 'Vitrin dolu'); return; } toast(`${r.cat.name} vitrine yerleşti.`, 'success', '🏛️ Sergilendi'); },
  'display-pick': el => openDisplayPicker(Number(el.dataset.slot)),
  'display-put': el => { const r = Game.displayItem(el.dataset.id, Number(el.dataset.slot)); Modal.close(); if (!r.ok) toast(r.msg, 'warn'); else toast(`${r.cat.name} vitrine yerleşti.`, 'success', '🏛️ Sergilendi'); },
  'display-view': el => openDisplayedItem(el.dataset.id),
  'display-take': el => { const r = Game.undisplayItem(el.dataset.id); Modal.close(); if (r.ok) toast(`${r.cat.name} envantere döndü.`, 'info'); },
  'buy-cabinet': () => { const r = Game.buyCabinet(); if (!r.ok) toast(r.msg, 'warn'); else toast(`${r.cabinets}. vitrin hazır: +${SHOP.SLOTS} yuva.`, 'success', '🪟 Yeni vitrin'); },
  'offer-accept': el => { const r = Game.acceptOffer(el.dataset.id); if (!r.ok) { toast(r.msg, 'warn'); renderShop(); return; } toast(`${r.cat.name} → ${r.buyer.name} · ${fmt(r.price)} · ${r.profit >= 0 ? 'kâr' : 'zarar'} ${fmt(Math.abs(r.profit))}`, r.profit >= 0 ? 'success' : 'warn', '🏛️ Koleksiyoncuya satıldı'); },
  'offer-decline': el => { Game.declineOffer(el.dataset.id); },
  'order-deliver': el => openOrderDeliver(el.dataset.id),
  'order-give': el => { const r = Game.fulfillOrder(el.dataset.oid, el.dataset.id); Modal.close(); if (!r.ok) { toast(r.msg, 'warn', 'Teslim edilemedi'); return; } toast(`${r.cat.name} → ${r.cust.name} · ${fmt(r.pay)}${r.bonus > 0 ? ' (+' + fmt(r.bonus) + ' ek ödeme)' : ''} · ${r.profit >= 0 ? 'kâr' : 'zarar'} ${fmt(Math.abs(r.profit))}`, r.profit >= 0 ? 'success' : 'warn', '🧾 Sipariş teslim edildi'); },
  'order-decline': el => { Game.declineOrder(el.dataset.id); },
  'new-day': () => { const d = Game.newDay(); toast(`Gün ${d}: tezgâhlar yenilendi.`, 'info', '🌅 Yeni gün'); },
  'to-auction': el => openStartAuction(el.dataset.id),
  'start-quick': el => { const i = $('#au-start-input'); if (i) { i.value = el.dataset.v; i.focus(); } },
  'start-auction': el => doStartAuction(el.dataset.id),
  dealer: el => doDealer(el.dataset.id),
  hammer: () => { const r = Auction.hammer(false); if (!r.ok) toast(r.msg, 'warn'); },
  'auction-cancel': () => confirmBox({ title: 'Mezat iptal edilsin mi?', text: 'Eşya envanterine geri döner ve mevcut teklifler geçersiz olur.',
    ok: 'Mezatı iptal et', danger: true, onOk: () => Auction.cancel() }),
  menu: () => openMenu(), howto: () => openHowTo(), schema: () => openSchema(),
  'copy-sql': async () => { toast((await copyText(SCHEMA_SQL)) ? 'SQL şeması panoya kopyalandı.' : 'Kopyalanamadı; metni elle seçip kopyalayabilirsin.', 'info'); },
  'copy-json': async () => { toast((await copyText(DB.exportJSON())) ? 'Oyun verisi JSON olarak panoya kopyalandı.' : 'Kopyalanamadı.', 'info'); },
  reset: () => confirmBox({ title: 'Oyun sıfırlansın mı?', text: 'Tüm ilerlemen, envanterin ve bakiyen silinir.', ok: 'Sıfırla', danger: true, onOk: resetGame }),
  'snd-toggle': () => Sound.toggleMute(),
  'snd-settings': () => openSoundSettings(),
  'snd-test': b => Sound.test(b.dataset.sound),
  bailout: () => { Modal.close(); Game.bailout(); toast(`Ailenden ${fmt(CFG.BAILOUT)} geldi. Yeniden dene!`, 'info', 'Aile yardımı'); }
};

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { if (Modal.isOpen() && !Modal.dismissible) return; Modal.close(); switchTab(tab.dataset.tab); return; }
  const ov = e.target.closest('[data-overlay]');
  if (ov && e.target === ov) { if (Modal.dismissible) Modal.close(); return; }
  const btn = e.target.closest('[data-action]');
  if (!btn || btn.disabled) return;
  const fn = ACTIONS[btn.dataset.action];
  if (fn) fn(btn, e);
});
document.addEventListener('input', e => { if (e.target.id === 'bg-input') validateOffer(); else if (e.target.dataset && e.target.dataset.snd) onSoundInput(e.target); });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'bg-input') { e.preventDefault(); submitOffer(); }
  else if (e.key === 'Enter' && e.target.id === 'au-start-input') { e.preventDefault(); const b = $('[data-action="start-auction"]'); if (b) b.click(); }
  else if (e.key === 'Escape' && Modal.isOpen() && Modal.dismissible) Modal.close();
});

function wireBus() {
  Bus.on('balance', d => { renderBalance(d.delta); setTimeout(checkStuck, 700); });
  Bus.on('inventory', () => {
    renderNav();
    if (UI.tab === 'auction' && UI.auctionBuilt && !Auction.live()) return;   // mezat az önce bitti: çekiç animasyonu 'auction:end' ile oynatılacak
    if (UI.tab === 'inventory' || UI.tab === 'auction' || UI.tab === 'shop') renderActive();
  });
  Bus.on('shop', d => {
    renderNav();
    if (d && d.exposed) d.exposed.forEach(i => toast(`Bir uzman sergideki ${Game.catalogOf(i).name} eşyasının TAKLİT olduğunu fark etti!`, 'warn', '🧐 Sahte ifşa oldu'));
    if (d && d.orders) { toast('Dükkâna bir müşteri geldi ve senden bir şey istiyor.', 'info', '🧾 Yeni sipariş'); if (UI.tab === 'market' && !UI.bargain) renderMarket(); }
    if (d && d.offers) toast('Bir koleksiyoncu vitrindeki eşyalarına teklif verdi.', 'info', '🏛️ Yeni teklif');
    if (UI.tab === 'shop' && !Modal.isOpen()) renderShop();
  });
  Bus.on('market', () => { if (UI.tab === 'market' && !UI.bargain) renderMarket(); });
  Bus.on('market:tick', d => {
    if (UI.tab !== 'market') return;
    const sig = Game.listings().map(l => l.id).join();
    if (sig !== UI.marketSig && !UI.bargain) renderMarket();
    if (d.removed) toast(`${d.removed} başka bir alıcıya gitti.`, 'info', 'Tezgâh boşaldı');
  });
  Bus.on('auction:start', () => renderNav());
  Bus.on('auction:tick', () => { if (UI.tab === 'auction') updateAuctionLive(); });
  Bus.on('auction:bid', hallBid);
  Bus.on('auction:withdraw', d => { hallWithdraw(d); toast(`${d.bidder.name} teklifini geri çekti, fiyat düştü!`, 'warn', 'Teklif geri çekildi'); });
  Bus.on('auction:end', e => {
    renderNav();
    if (e.status === 'sold') {
      toast(`${e.cat.name} → ${e.bidder.name} · ${fmt(e.price)} · ${e.profit >= 0 ? 'kâr' : 'zarar'} ${fmt(Math.abs(e.profit))}`,
        e.profit >= 0 ? 'success' : 'warn', e.auto ? '🔨 Çekiç düştü — Satıldı!' : '🔨 Eşya satıldı!');
    } else if (e.status === 'unsold') {
      toast('Salonda kimse teklif vermedi; eşya envantere döndü. Açılış fiyatı fazla yüksek olabilir.', 'warn', 'Mezat sonuçsuz');
    } else {
      toast('Eşya envantere geri döndü.', 'info', 'Mezat iptal edildi');
    }
    if (UI.tab === 'auction' && hallEnd(e)) syncAmbience();
    else if (UI.tab === 'auction' || UI.tab === 'inventory') renderActive();
    setTimeout(checkStuck, 700);
  });
}

function init() {
  if (!DB.load()) Game.newGame(); else Game.syncCatalog();
  wireBus();
  Sound.wire(); Sound.mountButton();
  Game.refillMarket(true);
  Auction.resume();
  { const r = Game.shopCatchUp(); if (r && (r.visitors || r.revenue)) setTimeout(() => toast(`Sen yokken ${r.visitors} ziyaretçi geldi, ${fmt(r.revenue)} giriş ücreti topladın.`, 'success', '🏛️ Dükkân'), 600); }
  setInterval(() => Game.shopTick(1), SHOP.TICK_MS);
  const h = (location.hash || '').slice(1);
  UI.tab = TABS.some(t => t.id === h) ? h : 'market';
  renderBalance();
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + UI.tab));
  renderNav();
  renderActive();
  setInterval(() => Game.marketTick(), CFG.MARKET_TICK_MS);
  window.addEventListener('beforeunload', () => DB.save());
  window.addEventListener('hashchange', () => { const x = location.hash.slice(1); if (x !== UI.tab && TABS.some(t => t.id === x)) switchTab(x); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) DB.save(); else renderBalance(); });
  if (!DB.meta.tutorial_done) setTimeout(openHowTo, 350); else setTimeout(checkStuck, 500);
}
init();

</script>
</body>
</html>
